name: Provision GitLab Mirror

on:
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force-push branches to GitLab (use if a branch diverged on GitLab and the normal push is rejected)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_push:
        description: "Force-push branches to GitLab (use if a branch diverged on GitLab and the normal push is rejected)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync_to_gitlab:
    name: Sync To GitLab
    runs-on: ubuntu-latest

    env:
      # Compliant branch names (must match the definitions' workflow: rules).
      # Shared by the auto-build and mirror-push steps.
      COMPLIANT_BRANCH_REGEX: '^(feature/.*|fix/.*|chore/.*|hotfix/v[0-9]+\.[0-9]+\.[0-9]+|release/v[0-9]+\.[0-9]+|main)$'

    steps:

      # --------------------------------------------------
      # Step 1: Validate Required Configuration
      # --------------------------------------------------

      - name: Validate Required Configuration
        id: validate_required_config
        uses: actions/github-script@v9
        env:
          GH_APP_ID:                 ${{ secrets.GH_APP_ID || vars.GH_APP_ID }}
          GH_APP_CLIENT_ID:          ${{ secrets.GH_APP_CLIENT_ID || vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY:        ${{ secrets.GH_APP_PRIVATE_KEY || vars.GH_APP_PRIVATE_KEY }}
          GITLAB_HOST:               ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN:          ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          GITLAB_TOP_LEVEL_GROUP_ID: ${{ secrets.GITLAB_TOP_LEVEL_GROUP_ID || vars.GITLAB_TOP_LEVEL_GROUP_ID }}
          GITLAB_MY_ORG_SUBGROUP:    ${{ secrets.GITLAB_MY_ORG_SUBGROUP || vars.GITLAB_MY_ORG_SUBGROUP }}
        with:
          script: |
            const required = {
              "GH_APP_ID"                 : process.env.GH_APP_ID,
              "GH_APP_CLIENT_ID"          : process.env.GH_APP_CLIENT_ID,
              "GH_APP_PRIVATE_KEY"        : process.env.GH_APP_PRIVATE_KEY,
              "GITLAB_HOST"               : process.env.GITLAB_HOST,
              "GITLAB_API_TOKEN"          : process.env.GITLAB_API_TOKEN,
              "GITLAB_TOP_LEVEL_GROUP_ID" : process.env.GITLAB_TOP_LEVEL_GROUP_ID,
              "GITLAB_MY_ORG_SUBGROUP"    : process.env.GITLAB_MY_ORG_SUBGROUP
            };

            const missing = Object.keys(required).filter((key) => !required[key]);

            if (missing.length > 0) {
              const repoFullName   = `${context.repo.owner}/${context.repo.repo}`;
              const repoVisibility = context.payload.repository.visibility;
              const isPrivateRepo  = repoVisibility === "private";
              const errorMessage   = "\n❌ Could not detect below required variables and secrets.\n" + missing.map((key) => "- " + key).join("\n");
              let troubleshootInstructions = [];

              if (!isPrivateRepo) {
                troubleshootInstructions.push(`This repository '${repoFullName}' is public`);
                troubleshootInstructions.push("For public repositories, setting the required variables and secrets at the organization level is sufficient.");
                troubleshootInstructions.push("So, perhaps required variables and secrets are not set up properly at the organization level.");
                troubleshootInstructions.push("Please set those and rerun this action.");
              } else {
                troubleshootInstructions.push(`This repository '${repoFullName}' is private.`);
                troubleshootInstructions.push("Private repositories can consume organization level variables and secrets only with paid plan");
                troubleshootInstructions.push("Run the 'Sync Secrets & Variables Across Private Repos' action to set the required variables and secrets at the repository level.");
                troubleshootInstructions.push("Or, kindly upgrade the plan to consume the required variables and secrets from the organization level.");
              }

              const troubleshootMessage = troubleshootInstructions.map((msg, index) => String(index + 1).padStart(troubleshootInstructions.length, ' ') + ". " + msg).join("\n");

              core.setFailed(`${errorMessage}\nℹ️ Follow the below instructions\n${troubleshootMessage}`);
              return;
            }

      # --------------------------------------------------
      # Step 2: Generate GitHub App Token
      # --------------------------------------------------
      #
      # Moved up front (this used to run right before 'Prepare Mirror Clone')
      # because 'Detect Force-Push Protection Skip Flags' also needs it - an
      # org-installed GitHub App token is the only way to read an
      # ORG-level Actions variable via the API (the default GITHUB_TOKEN is
      # always scoped to this one repo and has no org-wide authority, no
      # matter what this workflow's 'permissions:' block grants). The token
      # is valid for an hour, comfortably longer than this job takes, so
      # generating it once here and reusing it later (in 'Prepare Mirror
      # Clone') is safe.
      #
      # Prerequisite: the GitHub App behind GH_APP_ID/GH_APP_CLIENT_ID must
      # have 'Organization variables' (read) and 'Variables' (read) granted,
      # in addition to whatever permissions it already has for the mirror
      # clone - otherwise the org/repo variable lookups below fail closed
      # (logged as a warning, treated as 'not set') rather than actually
      # detecting the opt-out.

      - name: Generate GitHub App Token
        id: generate_github_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id:   ${{ secrets.GH_APP_CLIENT_ID || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY || vars.GH_APP_PRIVATE_KEY }}
          owner:       ${{ github.repository_owner }}

      # --------------------------------------------------
      # Step 3: Validate And Extract Repository Metadata
      # --------------------------------------------------

      - name: Validate Repository Metadata
        id: validate_repository_metadata
        if: always()
        uses: actions/github-script@v9
        env:
          PRODUCT_LINE: ${{ vars.REPO_METADATA_PRODUCT_LINE }}
          ASPECT:       ${{ vars.REPO_METADATA_ASPECT }}
          NAME:         ${{ vars.REPO_METADATA_NAME }}
          TYPE:         ${{ vars.REPO_METADATA_TYPE }}
          TENANT:       ${{ vars.REPO_METADATA_TENANT }}
          MANAGED:      ${{ vars.REPO_METADATA_MANAGED }}
        with:
          script: |
            console.log("\nValidating repository metadata...");

            if (!process.env.MANAGED || process.env.MANAGED.toLowerCase() !== "true") {
              core.setFailed("\n❌ Repository is not configured for GitLab sync (REPO_METADATA_MANAGED != true)");
              return;
            }

            const required = {
              PRODUCT_LINE : process.env.PRODUCT_LINE,
              ASPECT       : process.env.ASPECT,
              NAME         : process.env.NAME,
              TYPE         : process.env.TYPE,
              MANAGED      : process.env.MANAGED
            };

            const missing = Object.entries(required)
              .filter(([_, v]) => !v)
              .map(([k]) => k);

            if (missing.length > 0) {
              core.setFailed(
                `\n❌ Missing required metadata:\n${missing.map(m => "- REPO_METADATA_" + m).join("\n")}`
              );
              return;
            }

            console.log("Metadata validated successfully");
            console.log(`ℹ️ ProductLine : ${process.env.PRODUCT_LINE}`);
            console.log(`ℹ️ Aspect      : ${process.env.ASPECT}`);
            console.log(`ℹ️ Repo Name   : ${process.env.NAME}`);
            console.log(`ℹ️ Repo Type   : ${process.env.TYPE}`);

            if (process.env.TENANT) {
              console.log(`ℹ️ Tenant      : ${process.env.TENANT}`);
            } else {
              console.log("ℹ️ Tenant      : none");
            }

            core.setOutput("product_line", process.env.PRODUCT_LINE);
            core.setOutput("aspect", process.env.ASPECT);
            core.setOutput("name", process.env.NAME);
            core.setOutput("tenant", process.env.TENANT || "");

      # --------------------------------------------------
      # Step 4: Ensure GitLab Project Exists
      # --------------------------------------------------

      - name: Ensure GitLab Project Exists
        id: ensure_gitlab_project_exists
        uses: actions/github-script@v9
        env:
          GITLAB_HOST:               ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN:          ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          GITLAB_TOP_LEVEL_GROUP_ID: ${{ secrets.GITLAB_TOP_LEVEL_GROUP_ID || vars.GITLAB_TOP_LEVEL_GROUP_ID }}
          GITLAB_MY_ORG_SUBGROUP:    ${{ secrets.GITLAB_MY_ORG_SUBGROUP || vars.GITLAB_MY_ORG_SUBGROUP }}
          PRODUCT_LINE:              ${{ steps.validate_repository_metadata.outputs.product_line }}
          ASPECT:                    ${{ steps.validate_repository_metadata.outputs.aspect }}
          NAME:                      ${{ steps.validate_repository_metadata.outputs.name }}
          TENANT:                    ${{ steps.validate_repository_metadata.outputs.tenant }}
        with:
          script: |
            const GITLAB_HOST               = process.env.GITLAB_HOST;
            const GITLAB_API_TOKEN          = process.env.GITLAB_API_TOKEN;
            const GITLAB_TOP_LEVEL_GROUP_ID = process.env.GITLAB_TOP_LEVEL_GROUP_ID;
            const GITLAB_MY_ORG_SUBGROUP    = process.env.GITLAB_MY_ORG_SUBGROUP;

            const product = process.env.PRODUCT_LINE;
            const aspect  = process.env.ASPECT;
            const name    = process.env.NAME;
            const tenant  = process.env.TENANT;

            async function glFetch(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });
              const data = await res.json();
              if (!res.ok) {
                let errorMessage = `GitLab API error [${method} ${path}] -> ${res.status} ${res.statusText}`;
                if (res.status === 404) {
                  errorMessage += `\nThis may indicate insufficient permissions for the GITLAB_API_TOKEN or that the resource does not exist.`;
                } else if (res.status === 401 || res.status === 403) {
                  errorMessage += `\nThis likely indicates an issue with the GITLAB_API_TOKEN permissions.`;
                } else {
                  errorMessage += `\nResponse: ${JSON.stringify(data)}`;
                }
                throw new Error(errorMessage);
              }
              return data;
            }

            // Like glFetch, but never throws - returns {status, ok, data} so callers can
            // distinguish "not found" (404) from a real error, e.g. when probing whether a
            // CICD variable already exists.
            async function glFetchRaw(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });
              let data = null;
              if (res.status !== 204) {
                const text = await res.text().catch(() => "");
                if (text) {
                  try {
                    data = JSON.parse(text);
                  } catch {
                    data = text;
                  }
                }
              }
              return { status : res.status, ok : res.ok, data };
            }

            async function findOrCreateGroup(parentId, groupName) {
              const subgroups = await glFetch("GET",
                `/groups/${parentId}/subgroups?search=${encodeURIComponent(groupName)}&per_page=100`
              );
              const existing = subgroups.find(
                g => g.path === groupName || g.name === groupName
              );
              if (existing) {
                console.log(`  ✓ Group exists : ${existing.full_path} (id=${existing.id})`);
                return existing;
              }
              console.log(`  → Creating group : ${groupName}`);
              const created = await glFetch("POST", "/groups", {
                name       : groupName,
                path       : groupName,
                parent_id  : parseInt(parentId),
                visibility : "private"
              });
              console.log(`  ✓ Group created : ${created.full_path} (id=${created.id})`);
              return created;
            }

            async function findOrCreateProject(groupId, projectName) {
              const projects = await glFetch("GET",
                `/groups/${groupId}/projects?search=${encodeURIComponent(projectName)}&per_page=100`
              );
              const existing = projects.find(
                p => p.path === projectName || p.name === projectName
              );
              if (existing) {
                console.log(`  ✓ Project exists : ${existing.web_url} (id=${existing.id})`);
                return existing;
              }
              console.log(`  → Creating project : ${projectName}`);
              const created = await glFetch("POST", "/projects", {
                name           : projectName,
                path           : projectName,
                namespace_id   : groupId,
                visibility     : "private",
                // 'main' is required upfront (see 'Configure Default Branch'): this
                // only takes effect once the first branch is pushed, since the
                // project has no commits at creation time.
                default_branch : "main"
              });
              console.log(`  ✓ Project created : ${created.web_url} (id=${created.id})`);
              return created;
            }

            // ─────────────────────────────────────────────
            // Effective top-level group ("github") + EFFECTIVE_ROOT_NAMESPACE
            // ─────────────────────────────────────────────
            //
            // GITLAB_TOP_LEVEL_GROUP_ID is treated as an "effective" top-level group by
            // this sync process, but it is NOT necessarily a real GitLab root group - it
            // is (and must always be) a subgroup of some real top-level group. GitLab's
            // built-in $CI_PROJECT_ROOT_NAMESPACE predefined variable resolves to the real
            // root, not to this group's parent, so it can't be used to reconstruct include
            // paths rooted at this group (e.g. "${..}/github/<org>/<product>/<aspect>/<repo>")
            // once the real root and this group stop being the same thing.
            //
            // Instead, this group publishes its own CICD variable, EFFECTIVE_ROOT_NAMESPACE,
            // set to the full_path of its immediate parent. As a group-level variable it is
            // inherited by every subgroup/project underneath (including this repo,
            // quarkus-maven-native-app, and gitlab-cicd-definitions), so
            // "${EFFECTIVE_ROOT_NAMESPACE}/github/..." always resolves correctly regardless
            // of how deep this group actually sits.

            async function ensureEffectiveRootNamespaceVariable(groupId, value) {
              const key = "EFFECTIVE_ROOT_NAMESPACE";
              const variableOptions = {
                variable_type : "env_var",
                masked        : false,
                protected     : false,
                raw           : true,
                description   : "Namespace of the parent of the effective top-level 'github' group. Use in place of CI_PROJECT_ROOT_NAMESPACE so include: paths rooted here resolve correctly."
              };

              const existing = await glFetchRaw("GET", `/groups/${groupId}/variables/${key}`);

              if (existing.status === 404) {
                console.log(`  → Group variable not found - creating '${key}'`);
                const created = await glFetchRaw("POST", `/groups/${groupId}/variables`, { key, value, ...variableOptions });
                if (!created.ok) {
                  throw new Error(`Failed to create group variable '${key}' -> ${created.status} ${JSON.stringify(created.data)}`);
                }
                console.log(`  ✓ Group variable created : ${key}=${value}`);
              } else if (existing.ok) {
                if (existing.data.value === value && existing.data.raw === true) {
                  console.log(`  ✓ Group variable already up to date : ${key}=${value}`);
                } else {
                  console.log(`  → Group variable differs - updating '${key}'`);
                  const updated = await glFetchRaw("PUT", `/groups/${groupId}/variables/${key}`, { value, ...variableOptions });
                  if (!updated.ok) {
                    throw new Error(`Failed to update group variable '${key}' -> ${updated.status} ${JSON.stringify(updated.data)}`);
                  }
                  console.log(`  ✓ Group variable updated : ${key}=${value}`);
                }
              } else {
                throw new Error(`Unexpected response fetching group variable '${key}' -> ${existing.status} ${JSON.stringify(existing.data)}`);
              }
            }

            async function ensureEffectiveTopLevelGroup(groupId) {
              const group = await glFetch("GET", `/groups/${groupId}`);

              if (group.name !== "github" || group.path !== "github") {
                throw new Error(
                  `Top level group must have name and path as 'github' - group id=${groupId} ('${group.full_path}') has name='${group.name}', path='${group.path}'.`
                );
              }

              if (!group.parent_id) {
                throw new Error(
                  `Effective top-level group '${group.full_path}' (id=${groupId}) has no parent group - it must always be a subgroup of a real GitLab top-level group.`
                );
              }

              const parentGroup = await glFetch("GET", `/groups/${group.parent_id}`);

              console.log(`  ✓ Effective top-level group validated : ${group.full_path} (parent='${parentGroup.full_path}')`);

              await ensureEffectiveRootNamespaceVariable(groupId, parentGroup.full_path);

              return group;
            }

            // ─────────────────────────────────────────────
            // Build GitLab group hierarchy
            // ─────────────────────────────────────────────
            //
            // Without tenant:                  With tenant:
            //   top-level-group                  top-level-group
            //   └── GITLAB_MY_ORG_SUBGROUP       └── tenant
            //       └── product                      └── product
            //           └── aspect                       └── aspect
            //               └── repo                         └── repo

            console.log("");
            console.log("ℹ️ Validating effective top-level group + syncing EFFECTIVE_ROOT_NAMESPACE...");
            console.log("------------------------------------");

            try {
              await ensureEffectiveTopLevelGroup(GITLAB_TOP_LEVEL_GROUP_ID);

              console.log("");
              console.log("ℹ️ Resolving GitLab group hierarchy...");
              console.log("------------------------------------");

              const orgSubgroupName = tenant ? `${GITLAB_MY_ORG_SUBGROUP}-${tenant}` : GITLAB_MY_ORG_SUBGROUP;

              const orgSubgroup = await findOrCreateGroup(GITLAB_TOP_LEVEL_GROUP_ID, orgSubgroupName);
              const productLineSubgroup = await findOrCreateGroup(orgSubgroup.id, product);
              const aspectSubgroup = await findOrCreateGroup(productLineSubgroup.id, aspect);

              console.log(`\nℹ️ Resolved final namespace : ${aspectSubgroup.full_path}`);
              console.log(`\nℹ️ Searching for project '${name}'...`);

              const project = await findOrCreateProject(aspectSubgroup.id, name);

              console.log(`\nℹ️ GitLab project path : ${project.path_with_namespace}`);

              core.setOutput("project_path", project.path_with_namespace);
              core.setOutput("project_id", project.id);
              core.setOutput("project_url", project.web_url);

              await core.summary
                .addHeading("GitLab Project", 2)
                .addTable([
                  [
                    { data : "Project ID", header : true },
                    { data : "Namespace",  header : true },
                    { data : "Repo URL",   header : true }
                  ],
                  [
                    `<code>${project.id}</code>`,
                    `<code>${project.path_with_namespace}</code>`,
                    `<a href="${project.web_url}">${project.web_url}</a>`
                  ]
                ])
                .write();
            } catch (error) {
              core.setFailed(`\n❌ Failed to ensure GitLab project exists\n${error.message}`);
              core.setOutput("project_path", "");
              core.setOutput("project_id", "");
              core.setOutput("project_url", "");

              await core.summary
                .addHeading("GitLab Project", 2)
                .addRaw("<p>❌ Failed to ensure the GitLab project exists. See the step log for details.</p>", true)
                .write();
            }

      # --------------------------------------------------
      # Step 5: Configure Default Branch
      # --------------------------------------------------
      #
      # 'main' is set as the default branch:
      #   - New projects: requested directly in the 'Ensure GitLab Project Exists'
      #     creation call (findOrCreateProject's POST body), so it takes effect the
      #     moment the first branch is pushed - no repository content exists yet at
      #     this point in the job, so there is nothing to reconcile here.
      #   - Pre-existing projects: fixed up here via PUT /projects/:id. GitLab
      #     rejects this if 'main' does not exist in the repository yet, so the
      #     fix-up is skipped (not failed) until 'main' has been mirrored at least
      #     once; the check simply re-runs (and self-heals) on every job run.

      - name: Configure Default Branch
        id: configure_default_branch
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_id != '' }}
        uses: actions/github-script@v9
        env:
          GITLAB_HOST:      ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_ID:       ${{ steps.ensure_gitlab_project_exists.outputs.project_id }}
        with:
          script: |
            const GITLAB_HOST      = process.env.GITLAB_HOST;
            const GITLAB_API_TOKEN = process.env.GITLAB_API_TOKEN;
            const PROJECT_ID       = process.env.PROJECT_ID;

            const DEFAULT_BRANCH = "main";

            async function glRequest(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });
              let data = null;
              if (res.status !== 204) {
                const text = await res.text().catch(() => "");
                if (text) {
                  try {
                    data = JSON.parse(text);
                  } catch {
                    data = text;
                  }
                }
              }
              return { status : res.status, ok : res.ok, data };
            }

            function describeGlError(data) {
              if (!data) {
                return "(no response body)";
              }
              if (typeof data === "string") {
                return data;
              }
              if (typeof data.error === "string") {
                return data.error;
              }
              if (typeof data.message === "string") {
                return data.message;
              }
              if (data.message && typeof data.message === "object") {
                return Object.entries(data.message)
                  .map(([field, msgs]) => `${field}: ${Array.isArray(msgs) ? msgs.join("; ") : msgs}`)
                  .join(" | ");
              }
              return JSON.stringify(data);
            }

            console.log("");
            console.log(`ℹ️ Ensuring default branch is '${DEFAULT_BRANCH}'...`);
            console.log("------------------------------------");

            try {
              const project = await glRequest("GET", `/projects/${PROJECT_ID}`);
              if (!project.ok) {
                throw new Error(`Failed to fetch project -> ${project.status} ${describeGlError(project.data)}`);
              }

              if (project.data.default_branch === DEFAULT_BRANCH) {
                console.log(`  ✓ Default branch already '${DEFAULT_BRANCH}'`);
              } else if (project.data.empty_repo) {
                console.log(`  ℹ️ Repository has no commits yet - default branch was already requested as '${DEFAULT_BRANCH}' at project creation; nothing to reconcile.`);
              } else {
                const branchCheck = await glRequest("GET", `/projects/${PROJECT_ID}/repository/branches/${encodeURIComponent(DEFAULT_BRANCH)}`);
                if (branchCheck.status === 404) {
                  console.log(`  ℹ️ Branch '${DEFAULT_BRANCH}' does not exist on GitLab yet - skipping for now (will self-heal once it is mirrored).`);
                } else if (!branchCheck.ok) {
                  throw new Error(`Failed to check branch '${DEFAULT_BRANCH}' -> ${branchCheck.status} ${describeGlError(branchCheck.data)}`);
                } else {
                  console.log(`  → Default branch differs ('${project.data.default_branch}' -> '${DEFAULT_BRANCH}') - updating`);
                  const updated = await glRequest("PUT", `/projects/${PROJECT_ID}`, { default_branch : DEFAULT_BRANCH });
                  if (!updated.ok) {
                    throw new Error(`Failed to update default branch -> ${updated.status} ${describeGlError(updated.data)}`);
                  }
                  console.log(`  ✓ Default branch updated to '${DEFAULT_BRANCH}'`);
                }
              }
            } catch (error) {
              core.setFailed(`\n❌ Failed to configure default branch\n${error.message}`);
            }

      # --------------------------------------------------
      # Step 6: Enforce Branch Naming Policy
      # --------------------------------------------------
      #
      # Restricts branch creation on GitLab to the same compliant names this
      # workflow itself mirrors (COMPLIANT_BRANCH_REGEX), via a project push rule.
      # Push rules are a GitLab Premium/Ultimate feature: on a Free-tier instance
      # the API responds 403, which is logged as a warning (not a failure) so
      # provisioning still completes - branch naming is still enforced
      # client-side by this workflow's own mirror logic either way.

      - name: Enforce Branch Naming Policy
        id: enforce_branch_naming_policy
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_id != '' }}
        uses: actions/github-script@v9
        env:
          GITLAB_HOST:            ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN:       ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_ID:             ${{ steps.ensure_gitlab_project_exists.outputs.project_id }}
          COMPLIANT_BRANCH_REGEX: ${{ env.COMPLIANT_BRANCH_REGEX }}
        with:
          script: |
            const GITLAB_HOST       = process.env.GITLAB_HOST;
            const GITLAB_API_TOKEN  = process.env.GITLAB_API_TOKEN;
            const PROJECT_ID        = process.env.PROJECT_ID;
            const BRANCH_NAME_REGEX = process.env.COMPLIANT_BRANCH_REGEX;

            async function glRequest(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });
              let data = null;
              if (res.status !== 204) {
                const text = await res.text().catch(() => "");
                if (text) {
                  try {
                    data = JSON.parse(text);
                  } catch {
                    data = text;
                  }
                }
              }
              return { status : res.status, ok : res.ok, data };
            }

            function describeGlError(data) {
              if (!data) {
                return "(no response body)";
              }
              if (typeof data === "string") {
                return data;
              }
              if (typeof data.error === "string") {
                return data.error;
              }
              if (typeof data.message === "string") {
                return data.message;
              }
              if (data.message && typeof data.message === "object") {
                return Object.entries(data.message)
                  .map(([field, msgs]) => `${field}: ${Array.isArray(msgs) ? msgs.join("; ") : msgs}`)
                  .join(" | ");
              }
              return JSON.stringify(data);
            }

            console.log("");
            console.log(`ℹ️ Ensuring branch-name push rule '${BRANCH_NAME_REGEX}'...`);
            console.log("------------------------------------");

            try {
              const existing = await glRequest("GET", `/projects/${PROJECT_ID}/push_rule`);
              if (!existing.ok) {
                throw new Error(`Failed to fetch push rule -> ${existing.status} ${describeGlError(existing.data)}`);
              }

              // GitLab returns 200 with a JSON 'null' body when no push rule
              // has ever been configured for this project - not a 404.
              if (existing.data && existing.data.branch_name_regex === BRANCH_NAME_REGEX) {
                console.log(`  ✓ Push rule already up to date : branch_name_regex='${BRANCH_NAME_REGEX}'`);
              } else {
                const method = existing.data ? "PUT" : "POST";
                console.log(`  → ${existing.data ? "Updating" : "Creating"} push rule with branch_name_regex='${BRANCH_NAME_REGEX}'`);
                const result = await glRequest(method, `/projects/${PROJECT_ID}/push_rule`, { branch_name_regex : BRANCH_NAME_REGEX });
                if (!result.ok) {
                  if (result.status === 403) {
                    console.log(`  ⚠️ Skipped - GitLab responded 403 (push rules require GitLab Premium/Ultimate on this instance): ${describeGlError(result.data)}`);
                  } else {
                    throw new Error(`Failed to ${existing.data ? "update" : "create"} push rule -> ${result.status} ${describeGlError(result.data)}`);
                  }
                } else {
                  console.log(`  ✓ Push rule ${existing.data ? "updated" : "created"} : branch_name_regex='${BRANCH_NAME_REGEX}'`);
                }
              }
            } catch (error) {
              core.setFailed(`\n❌ Failed to enforce branch naming policy\n${error.message}`);
            }

      # --------------------------------------------------
      # Step 7: Detect Force-Push Protection Skip Flags
      # --------------------------------------------------
      #
      # Org-wide kill switch, with a per-repo/per-branch opt-in underneath it:
      #
      #   ALLOW_SKIPPING_FORCE_PUSH_PROTECTION_ENFORCEMENT_ON_GITLAB
      #     Must be 'true' at the ORG level specifically. Read via the
      #     org-scoped REST endpoint (not the `vars.` expression context,
      #     which would silently fall back to - or be shadowed by - a
      #     repo-level variable of the same name). A repo cannot grant
      #     itself this switch by defining the same-named variable locally.
      #
      #   SKIP_FORCE_PUSH_PROTECTION_ENFORCEMENT_ON_GITLAB_FOR_MAIN_BRANCH
      #   SKIP_FORCE_PUSH_PROTECTION_ENFORCEMENT_ON_GITLAB_FOR_RELEASE_BRANCH
      #     Only consulted when the org switch above is 'true'. Each must be
      #     'true' at the REPO level specifically, via the repo-scoped REST
      #     endpoint - again bypassing `vars.`, so an org-level variable of
      #     the same name (however unlikely) cannot leak in as inherited.
      #
      # Any lookup failure (403 - the App token below isn't permissioned for
      # this, network error, etc.) fails CLOSED: treated the same as "not
      # set", so force-push protection stays fully enforced unless the
      # opt-out chain is unambiguously proven to apply.

      - name: Detect Force-Push Protection Skip Flags
        id: detect_force_push_protection_skip_flags
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_id != '' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            const ORG_FLAG_NAME     = "ALLOW_SKIPPING_FORCE_PUSH_PROTECTION_ENFORCEMENT_ON_GITLAB";
            const MAIN_SKIP_NAME    = "SKIP_FORCE_PUSH_PROTECTION_ENFORCEMENT_ON_GITLAB_FOR_MAIN_BRANCH";
            const RELEASE_SKIP_NAME = "SKIP_FORCE_PUSH_PROTECTION_ENFORCEMENT_ON_GITLAB_FOR_RELEASE_BRANCH";

            const org  = context.repo.owner;
            const repo = context.repo.repo;

            function isTrue(value) {
              return typeof value === "string" && value.trim().toLowerCase() === "true";
            }

            // Reads a variable at EXACTLY the given scope. Unlike the `vars.`
            // expression context (which merges repo-over-org for the same
            // name), these REST endpoints only ever return what is actually
            // defined at that one scope - a 404 here means "not set at this
            // scope", full stop, regardless of what exists at the other scope.
            async function getOrgVariableExact(name) {
              try {
                const res = await github.rest.actions.getOrgVariable({ org, name });
                return res.data.value;
              } catch (error) {
                if (error.status === 404) {
                  return null;
                }
                console.log(`  ⚠️ Could not read org-level variable '${name}' (status=${error.status || "?"}) - treating as not set. ${error.message}`);
                return null;
              }
            }

            async function getRepoVariableExact(name) {
              try {
                const res = await github.rest.actions.getRepoVariable({ owner: org, repo, name });
                return res.data.value;
              } catch (error) {
                if (error.status === 404) {
                  return null;
                }
                console.log(`  ⚠️ Could not read repo-level variable '${name}' (status=${error.status || "?"}) - treating as not set. ${error.message}`);
                return null;
              }
            }

            console.log("");
            console.log("ℹ️ Checking for the org-level force-push protection opt-out...");
            console.log("------------------------------------");

            const orgFlagValue    = await getOrgVariableExact(ORG_FLAG_NAME);
            const orgOptOutEnabled = isTrue(orgFlagValue);

            if (!orgOptOutEnabled) {
              console.log(`  ✓ '${ORG_FLAG_NAME}' is not 'true' at the org level - force-push protection stays fully enforced (normal behavior).`);
              core.setOutput("skip_main", "false");
              core.setOutput("skip_release", "false");
              return;
            }

            console.log(`  ⚠️ '${ORG_FLAG_NAME}' = 'true' at the org level - this repo may opt out per branch via its OWN repo-level variables.`);

            const mainSkipValue    = await getRepoVariableExact(MAIN_SKIP_NAME);
            const releaseSkipValue = await getRepoVariableExact(RELEASE_SKIP_NAME);

            const skipMain    = isTrue(mainSkipValue);
            const skipRelease = isTrue(releaseSkipValue);

            console.log(`  ${skipMain ? "⚠️" : "✓"} '${MAIN_SKIP_NAME}' (repo-level) = '${mainSkipValue ?? "(not set)"}' -> force-push enforcement on 'main' ${skipMain ? "SKIPPED" : "stays enforced"}`);
            console.log(`  ${skipRelease ? "⚠️" : "✓"} '${RELEASE_SKIP_NAME}' (repo-level) = '${releaseSkipValue ?? "(not set)"}' -> force-push enforcement on release branches ${skipRelease ? "SKIPPED" : "stays enforced"}`);

            core.setOutput("skip_main", skipMain ? "true" : "false");
            core.setOutput("skip_release", skipRelease ? "true" : "false");

      # --------------------------------------------------
      # Step 8: Protect main & Release Branches
      # --------------------------------------------------
      #
      # 'main' and release branches (release/vX.Y, matched here via the wildcard
      # 'release/v*' - GitLab protected-branch names support glob wildcards
      # only, not full regex) get identical protection: push and merge
      # restricted to Maintainers, force push disallowed by default - unless
      # 'Detect Force-Push Protection Skip Flags' resolved a skip for that
      # branch, in which case push/merge access are still fully enforced but
      # the force-push setting is left exactly as GitLab currently has it
      # (see the 'skipForcePushEnforcement' handling below). A rule can be
      # created before the branch itself exists on GitLab (standard GitLab
      # behavior - the protection simply applies once the branch is pushed),
      # so this runs safely even for a project created earlier in this same
      # job.
      #
      # Reconciliation deletes and re-creates a mismatched rule rather than
      # patching it in place, since not every field this workflow manages
      # (push/merge access level) is guaranteed to be PATCH-able on every
      # GitLab version - delete+recreate is universally supported.

      - name: Protect main & Release Branches
        id: protect_main_and_release_branches
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_id != '' }}
        uses: actions/github-script@v9
        env:
          GITLAB_HOST:      ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_ID:       ${{ steps.ensure_gitlab_project_exists.outputs.project_id }}
          SKIP_MAIN:        ${{ steps.detect_force_push_protection_skip_flags.outputs.skip_main }}
          SKIP_RELEASE:     ${{ steps.detect_force_push_protection_skip_flags.outputs.skip_release }}
        with:
          script: |
            const GITLAB_HOST      = process.env.GITLAB_HOST;
            const GITLAB_API_TOKEN = process.env.GITLAB_API_TOKEN;
            const PROJECT_ID       = process.env.PROJECT_ID;

            const MAINTAINER = 40;

            // Set only when 'Detect Force-Push Protection Skip Flags' resolved an
            // approved org+repo opt-out for that branch - see this step's header
            // comment. Push/merge access are unaffected either way.
            const PROTECTED_BRANCHES = [
              { name : "main",       label : "main",                              skipForcePushEnforcement : process.env.SKIP_MAIN === "true" },
              { name : "release/v*", label : "release/vX.Y (release/v*)",         skipForcePushEnforcement : process.env.SKIP_RELEASE === "true" }
            ];

            async function glRequest(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });
              let data = null;
              if (res.status !== 204) {
                const text = await res.text().catch(() => "");
                if (text) {
                  try {
                    data = JSON.parse(text);
                  } catch {
                    data = text;
                  }
                }
              }
              return { status : res.status, ok : res.ok, data };
            }

            function describeGlError(data) {
              if (!data) {
                return "(no response body)";
              }
              if (typeof data === "string") {
                return data;
              }
              if (typeof data.error === "string") {
                return data.error;
              }
              if (typeof data.message === "string") {
                return data.message;
              }
              if (data.message && typeof data.message === "object") {
                return Object.entries(data.message)
                  .map(([field, msgs]) => `${field}: ${Array.isArray(msgs) ? msgs.join("; ") : msgs}`)
                  .join(" | ");
              }
              return JSON.stringify(data);
            }

            // GitLab's response represents access levels as arrays (e.g.
            // push_access_levels: [{ access_level: 40, ... }]), even though the
            // create/update request accepts the singular *_access_level shorthand.
            function levelMatches(levels, expectedAccessLevel) {
              return Array.isArray(levels) && levels.length === 1 && levels[0].access_level === expectedAccessLevel;
            }

            // When force-push enforcement is skipped for this branch, whatever
            // GitLab currently has for allow_force_push is accepted as-is - it is
            // simply not part of what "matches" checks, so no in-place mismatch
            // is ever reported for that field alone.
            function matches(rule, skipForcePushEnforcement) {
              const levelsOk = levelMatches(rule.push_access_levels, MAINTAINER)
                && levelMatches(rule.merge_access_levels, MAINTAINER);
              if (!levelsOk) {
                return false;
              }
              return skipForcePushEnforcement ? true : rule.allow_force_push === false;
            }

            async function ensureProtectedBranch(name, label, skipForcePushEnforcement) {
              console.log("");
              console.log(`ℹ️ Ensuring protected branch '${label}'${skipForcePushEnforcement ? " (force-push enforcement SKIPPED for this branch)" : ""}...`);
              console.log("------------------------------------");

              const encodedName = encodeURIComponent(name);
              const existing = await glRequest("GET", `/projects/${PROJECT_ID}/protected_branches/${encodedName}`);

              // Only meaningful when skipForcePushEnforcement AND a mismatched
              // existing rule forces a delete+recreate below: carries the
              // CURRENT allow_force_push value through unchanged, so the
              // otherwise-unavoidable recreate never flips it on our behalf.
              let preserveAllowForcePush;

              if (existing.status === 404) {
                console.log(`  → Not protected yet - creating`);
              } else if (existing.ok) {
                if (matches(existing.data, skipForcePushEnforcement)) {
                  const forcePushNote = skipForcePushEnforcement
                    ? `force-push enforcement skipped (currently ${existing.data.allow_force_push ? "allowed" : "disallowed"} on GitLab - left untouched)`
                    : "force-push=disallowed";
                  console.log(`  ✓ Already protected as required (push=Maintainer, merge=Maintainer, ${forcePushNote})`);
                  return;
                }
                console.log(`  → Protection differs - re-creating`);
                if (skipForcePushEnforcement) {
                  preserveAllowForcePush = existing.data.allow_force_push;
                }
                const deleted = await glRequest("DELETE", `/projects/${PROJECT_ID}/protected_branches/${encodedName}`);
                if (!deleted.ok) {
                  throw new Error(`Failed to unprotect '${name}' before re-creating -> ${deleted.status} ${describeGlError(deleted.data)}`);
                }
              } else {
                throw new Error(`Failed to fetch protected branch '${name}' -> ${existing.status} ${describeGlError(existing.data)}`);
              }

              const desired = { push_access_level : MAINTAINER, merge_access_level : MAINTAINER };
              let forcePushNote;
              if (!skipForcePushEnforcement) {
                desired.allow_force_push = false;
                forcePushNote = "force-push=disallowed";
              } else if (preserveAllowForcePush !== undefined) {
                // Recreating anyway for an unrelated (push/merge level) reason -
                // still don't touch the existing force-push setting.
                desired.allow_force_push = preserveAllowForcePush;
                forcePushNote = `force-push enforcement skipped (carried over as ${preserveAllowForcePush ? "allowed" : "disallowed"})`;
              } else {
                // Brand-new rule with enforcement skipped: allow_force_push is
                // omitted entirely rather than sent as true or false - GitLab's
                // own platform default applies, we are not the one enforcing it.
                forcePushNote = "force-push enforcement skipped (left to GitLab's own default on creation)";
              }

              const created = await glRequest("POST", `/projects/${PROJECT_ID}/protected_branches`, { name, ...desired });
              if (!created.ok) {
                throw new Error(`Failed to protect '${name}' -> ${created.status} ${describeGlError(created.data)}`);
              }
              console.log(`  ✓ Protected : push=Maintainer, merge=Maintainer, ${forcePushNote}`);
            }

            try {
              for (const { name, label, skipForcePushEnforcement } of PROTECTED_BRANCHES) {
                await ensureProtectedBranch(name, label, skipForcePushEnforcement);
              }
            } catch (error) {
              core.setFailed(`\n❌ Failed to protect main/release branches\n${error.message}`);
            }

      # --------------------------------------------------
      # Step 9: Protect Version Tags
      # --------------------------------------------------
      #
      # Tags matching v<major>.<minor>.<patch> are protected at the Maintainer
      # level, via the wildcard 'v*' (GitLab protected-tag names support glob
      # wildcards only, not full regex). This is safe in practice: the only
      # tags this pipeline (and the branch-naming push rule, where licensed)
      # ever let through are vX.Y.Z-shaped, so 'v*' never protects anything
      # outside the intended shape.

      - name: Protect Version Tags
        id: protect_version_tags
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_id != '' }}
        uses: actions/github-script@v9
        env:
          GITLAB_HOST:      ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_ID:       ${{ steps.ensure_gitlab_project_exists.outputs.project_id }}
        with:
          script: |
            const GITLAB_HOST      = process.env.GITLAB_HOST;
            const GITLAB_API_TOKEN = process.env.GITLAB_API_TOKEN;
            const PROJECT_ID       = process.env.PROJECT_ID;

            const MAINTAINER  = 40;
            const TAG_PATTERN = "v*";

            async function glRequest(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });
              let data = null;
              if (res.status !== 204) {
                const text = await res.text().catch(() => "");
                if (text) {
                  try {
                    data = JSON.parse(text);
                  } catch {
                    data = text;
                  }
                }
              }
              return { status : res.status, ok : res.ok, data };
            }

            function describeGlError(data) {
              if (!data) {
                return "(no response body)";
              }
              if (typeof data === "string") {
                return data;
              }
              if (typeof data.error === "string") {
                return data.error;
              }
              if (typeof data.message === "string") {
                return data.message;
              }
              if (data.message && typeof data.message === "object") {
                return Object.entries(data.message)
                  .map(([field, msgs]) => `${field}: ${Array.isArray(msgs) ? msgs.join("; ") : msgs}`)
                  .join(" | ");
              }
              return JSON.stringify(data);
            }

            function levelMatches(levels, expectedAccessLevel) {
              return Array.isArray(levels) && levels.length === 1 && levels[0].access_level === expectedAccessLevel;
            }

            console.log("");
            console.log(`ℹ️ Ensuring protected tag '${TAG_PATTERN}'...`);
            console.log("------------------------------------");

            try {
              const encodedName = encodeURIComponent(TAG_PATTERN);
              const existing = await glRequest("GET", `/projects/${PROJECT_ID}/protected_tags/${encodedName}`);

              if (existing.status === 404) {
                console.log(`  → Not protected yet - creating`);
              } else if (existing.ok) {
                if (levelMatches(existing.data.create_access_levels, MAINTAINER)) {
                  console.log(`  ✓ Already protected as required`);
                  return;
                }
                console.log(`  → Protection differs - re-creating`);
                const deleted = await glRequest("DELETE", `/projects/${PROJECT_ID}/protected_tags/${encodedName}`);
                if (!deleted.ok) {
                  throw new Error(`Failed to unprotect '${TAG_PATTERN}' before re-creating -> ${deleted.status} ${describeGlError(deleted.data)}`);
                }
              } else {
                throw new Error(`Failed to fetch protected tag '${TAG_PATTERN}' -> ${existing.status} ${describeGlError(existing.data)}`);
              }

              const created = await glRequest("POST", `/projects/${PROJECT_ID}/protected_tags`, { name : TAG_PATTERN, create_access_level : MAINTAINER });
              if (!created.ok) {
                throw new Error(`Failed to protect tag '${TAG_PATTERN}' -> ${created.status} ${describeGlError(created.data)}`);
              }
              console.log(`  ✓ Protected : create=Maintainer`);
            } catch (error) {
              core.setFailed(`\n❌ Failed to protect version tags\n${error.message}`);
            }

      # --------------------------------------------------
      # Step 10: Sync Reserved GitLab CICD Variables
      # --------------------------------------------------
      #
      # These variables are managed by this workflow and are treated as RESERVED:
      # the variable sync step never prunes them. This step publishes the reserved key
      # list as its 'reserved_keys' output, which the 'Sync GitHub Variables' step reads.

      - name: Sync Reserved GitLab CICD Variables
        id: sync_reserved_gitlab_variables
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_id != '' }}
        uses: actions/github-script@v9
        env:
          GITLAB_HOST:      ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_ID:       ${{ steps.ensure_gitlab_project_exists.outputs.project_id }}
          GH_PROJECT_REPO:  ${{ github.repository }}
        with:
          script: |
            const GITLAB_HOST      = process.env.GITLAB_HOST;
            const GITLAB_API_TOKEN = process.env.GITLAB_API_TOKEN;
            const PROJECT_ID       = process.env.PROJECT_ID;

            const VARIABLE_KEY   = "GH_PROJECT_REPO";
            const VARIABLE_VALUE = process.env.GH_PROJECT_REPO;

            // Reserved keys managed by this step. Published (early, so it is always set
            // when this step runs) as an output so the variable sync step knows which
            // project variables it must never prune.
            const RESERVED_KEYS = [VARIABLE_KEY];
            core.setOutput("reserved_keys", JSON.stringify(RESERVED_KEYS));

            // GitLab CICD variable options:
            //   environment_scope = "*"     -> all environments
            //   masked            = false   -> visible (not masked)
            //   protected         = false   -> not protected
            //   raw               = true    -> expansion disabled, value stored literally
            const variableOptions = {
              variable_type     : "env_var",
              environment_scope : "*",
              masked            : false,
              protected         : false,
              raw               : true,
              description       : "GitHub source repo of the project."
            };

            async function glRequest(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });

              // Preserve the raw response body so a GitLab error is never lost: parse it as
              // JSON when possible, otherwise keep the raw text (e.g. an HTML/plain error).
              let data = null;
              if (res.status !== 204) {
                const text = await res.text().catch(() => "");
                if (text) {
                  try {
                    data = JSON.parse(text);
                  } catch {
                    data = text;
                  }
                }
              }
              return { status : res.status, ok : res.ok, data };
            }

            // Extract a human-readable message from a GitLab error response body. GitLab
            // returns errors as a string ('message'/'error'), as field -> [messages]
            // (e.g. { message: { base: ["..."] } }), or occasionally as raw text.
            function describeGlError(data) {
              if (!data) {
                return "(no response body)";
              }
              if (typeof data === "string") {
                return data;
              }
              if (typeof data.error === "string") {
                return data.error;
              }
              if (typeof data.message === "string") {
                return data.message;
              }
              if (data.message && typeof data.message === "object") {
                return Object.entries(data.message)
                  .map(([field, msgs]) => `${field}: ${Array.isArray(msgs) ? msgs.join("; ") : msgs}`)
                  .join(" | ");
              }
              return JSON.stringify(data);
            }

            console.log("");
            console.log(`ℹ️ Ensuring GitLab CICD variable '${VARIABLE_KEY}'...`);
            console.log("------------------------------------");

            try {
              const existing = await glRequest("GET", `/projects/${PROJECT_ID}/variables/${VARIABLE_KEY}`);

              if (existing.status === 404) {
                console.log(`  → Variable not found - creating '${VARIABLE_KEY}'`);
                const created = await glRequest("POST", `/projects/${PROJECT_ID}/variables`, {
                  key   : VARIABLE_KEY,
                  value : VARIABLE_VALUE,
                  ...variableOptions
                });
                if (!created.ok) {
                  throw new Error(`Failed to create variable -> ${created.status} ${describeGlError(created.data)}`);
                }
                console.log(`  ✓ Variable created : ${VARIABLE_KEY}=${VARIABLE_VALUE}`);
              } else if (existing.ok) {
                const valueChanged = existing.data.value !== VARIABLE_VALUE;
                const rawChanged   = existing.data.raw !== true;

                if (!valueChanged && !rawChanged) {
                  console.log(`  ✓ Variable already up to date : ${VARIABLE_KEY}=${VARIABLE_VALUE}`);
                } else {
                  const reasons = [];
                  if (valueChanged) reasons.push(`value '${existing.data.value}' -> '${VARIABLE_VALUE}'`);
                  if (rawChanged)   reasons.push(`raw ${existing.data.raw} -> true`);
                  console.log(`  → Variable differs (${reasons.join(", ")}) - updating '${VARIABLE_KEY}'`);
                  const updated = await glRequest("PUT", `/projects/${PROJECT_ID}/variables/${VARIABLE_KEY}`, {
                    value : VARIABLE_VALUE,
                    ...variableOptions
                  });
                  if (!updated.ok) {
                    throw new Error(`Failed to update variable -> ${updated.status} ${describeGlError(updated.data)}`);
                  }
                  console.log(`  ✓ Variable updated : ${VARIABLE_KEY}=${VARIABLE_VALUE}`);
                }
              } else {
                throw new Error(`Unexpected response fetching variable -> ${existing.status} ${describeGlError(existing.data)}`);
              }
            } catch (error) {
              core.setFailed(`\n❌ Failed to ensure GitLab CICD variable '${VARIABLE_KEY}'\n${error.message}`);
            }

      # --------------------------------------------------
      # Step 11: Sync GitHub Variables To GitLab CICD
      # --------------------------------------------------

      - name: Sync GitHub Variables To GitLab CICD
        id: sync_github_variables_to_gitlab
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_id != '' }}
        uses: actions/github-script@v9
        env:
          GITLAB_HOST:      ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_ID:       ${{ steps.ensure_gitlab_project_exists.outputs.project_id }}
          RESERVED_KEYS:    ${{ steps.sync_reserved_gitlab_variables.outputs.reserved_keys }}
          ALL_GH_VARS:      ${{ toJSON(vars) }}
          ALL_GH_SECRETS:   ${{ toJSON(secrets) }}
        with:
          script: |
            const GITLAB_HOST      = process.env.GITLAB_HOST;
            const GITLAB_API_TOKEN = process.env.GITLAB_API_TOKEN;
            const PROJECT_ID       = process.env.PROJECT_ID;

            // Variables to sync are sourced from GitHub Actions variables and secrets.
            // The name follows a fixed grammar:  GL_<flags>__<name>
            // A double underscore separates the 'GL_' prefix (plus optional flag block)
            // from the actual variable name. The flag block sets boolean GitLab
            // properties, in any order/combination:
            //   M -> masked    P -> protected    E -> expansion (enable $ variable expansion)
            //   H -> masked and hidden (implies masked; value is write-only in GitLab)
            // Expansion is DISABLED by default (GitLab raw=true); the E flag enables it (raw=false).
            // The 'GL_<flags>__' part is stripped before saving:
            //   GL__<name>       -> masked=false, protected=false, expansion=false  (no flags)
            //   GL_M__<name>     -> masked
            //   GL_P__<name>     -> protected
            //   GL_E__<name>     -> expansion enabled
            //   GL_H__<name>     -> masked and hidden
            //   GL_MP__<name>    -> masked + protected   (order/duplication independent)
            //   GL_MPE__<name>   -> masked + protected + expansion   ... and every other combo
            // The 'hidden' visibility (H) can only be set when the variable is first
            // created; it cannot be toggled afterwards, and GitLab never returns a hidden
            // variable's value (so its value cannot be compared - see the sync loop).
            // The name is everything after the FIRST '__', taken verbatim. It may contain
            // underscores or flag-looking segments without ambiguity, and any extra
            // separator underscores are kept as part of the name (this is intended), e.g.
            //   GL__MP_TOKEN     -> name 'MP_TOKEN', no flags
            //   GL_M__MP_TOKEN   -> name 'MP_TOKEN', masked
            //   GL__FOO__BAR     -> name 'FOO__BAR', no flags
            //   GL___FOO         -> name '_FOO', no flags   (leading underscore preserved)
            // An invalid flag block (unknown letters or duplicates) is tolerated: the
            // variable is still synced with all flags defaulted to false, e.g.
            //   GL_X__FOO        -> name 'FOO', no flags
            const PREFIX     = "GL_";
            const SEPARATOR  = "__";
            const FLAG_PROPS = { M : "masked", P : "protected", E : "expansion", H : "hidden" };

            // Parse a GitHub key into the GitLab key + resolved flags, or null if it is
            // not a syncable 'GL_<flags>__<name>' variable.
            function parseGlKey(ghKey) {
              if (!ghKey.startsWith(PREFIX)) {
                return null;
              }

              // Split the prefix/flag head from the name at the first double underscore.
              const sepIdx = ghKey.indexOf(SEPARATOR);
              if (sepIdx === -1) {
                return null;
              }

              const flagBlock = ghKey.slice(PREFIX.length, sepIdx);   // chars between 'GL_' and '__'
              const name      = ghKey.slice(sepIdx + SEPARATOR.length);
              if (!name) {
                return null;
              }

              const flags = { masked : false, protected : false, expansion : false, hidden : false };

              // Empty flag block (GL__<name>) means "all flags default". A non-empty block
              // is applied only when valid (known M/P/R letters, no duplicates); an invalid
              // block is tolerated and falls back to the default flag values.
              if (flagBlock.length > 0) {
                const chars    = flagBlock.split("");
                const allFlags = chars.every((c) => FLAG_PROPS[c]);
                const noDupes  = new Set(chars).size === chars.length;
                if (allFlags && noDupes) {
                  for (const c of chars) {
                    flags[FLAG_PROPS[c]] = true;
                  }
                }
              }

              return { glKey : name, ...flags };
            }

            const allGhVars    = JSON.parse(process.env.ALL_GH_VARS    || "{}");
            const allGhSecrets = JSON.parse(process.env.ALL_GH_SECRETS || "{}");

            // GitLab CICD variable options common to every synced variable:
            //   variable_type     = "env_var" -> environment variable
            //   environment_scope = "*"       -> all environments
            // ('masked', 'protected' and expansion are resolved per variable from its flags;
            //  expansion is off by default (raw=true), so values are stored literally unless
            //  the E flag enables $ variable expansion.)
            const baseVariableOptions = {
              variable_type     : "env_var",
              environment_scope : "*"
            };

            async function glRequest(method, path, body) {
              const res = await fetch(`${GITLAB_HOST}/api/v4${path}`, {
                method,
                headers: {
                  "PRIVATE-TOKEN" : GITLAB_API_TOKEN,
                  "Content-Type"  : "application/json"
                },
                ...(body ? { body : JSON.stringify(body) } : {})
              });
              // Preserve the raw response body so a GitLab error is never lost: parse it as
              // JSON when possible, otherwise keep the raw text (e.g. an HTML/plain error).
              let data = null;
              if (res.status !== 204) {
                const text = await res.text().catch(() => "");
                if (text) {
                  try {
                    data = JSON.parse(text);
                  } catch {
                    data = text;
                  }
                }
              }
              return { status : res.status, ok : res.ok, data };
            }

            // GitLab's requirements for masked (and masked-and-hidden) variable values.
            // Surfaced when a create/update is rejected for violating these rules.
            const MASKING_RULES = [
              "GitLab masking requirements for masked / hidden variable values:",
              "  - must be a single line (no newlines)",
              "  - must be at least 8 characters long",
              "  - must not contain whitespace",
              "  - may only use Base64 characters (A-Z a-z 0-9 + / =) plus '@', ':', '.', '~', '-'"
            ].join("\n");

            // Extract a human-readable message from a GitLab error response body. GitLab
            // returns errors as a string ('message'/'error') or as field -> [messages]
            // (e.g. { message: { base: ["...does not meet the masking requirements"] } }).
            function describeGlError(data) {
              if (!data) {
                return "(no response body)";
              }
              if (typeof data === "string") {
                return data;
              }
              if (typeof data.error === "string") {
                return data.error;
              }
              if (typeof data.message === "string") {
                return data.message;
              }
              if (data.message && typeof data.message === "object") {
                return Object.entries(data.message)
                  .map(([field, msgs]) => `${field}: ${Array.isArray(msgs) ? msgs.join("; ") : msgs}`)
                  .join(" | ");
              }
              return JSON.stringify(data);
            }

            // Build the error thrown when a create/update fails, appending GitLab's masking
            // rules when the rejection looks masking-related and the value was masked.
            function glWriteError(action, response, wasMasked) {
              const detail = describeGlError(response.data);
              let message = `Failed to ${action} variable -> ${response.status} ${detail}`;
              if (wasMasked && /mask/i.test(detail)) {
                message += `\n  ℹ️ The value appears to violate GitLab's masking rules.\n${MASKING_RULES}`;
              }
              return message;
            }

            // Create or update a variable via one request, throwing a descriptive error
            // (with masking guidance when relevant) on failure.
            async function writeVariable(action, method, path, body) {
              const res = await glRequest(method, path, body);
              if (!res.ok) {
                const wasMasked = body.masked === true || body.masked_and_hidden === true;
                throw new Error(glWriteError(action, res, wasMasked));
              }
              return res;
            }

            // "How to" block appended to the job summary (always, whether or not any
            // candidates were found) so authors can see the naming convention and rules
            // directly on the run. Written as HTML (with escaped angle brackets and tables)
            // so it renders cleanly in the step summary.
            const CONVENTION_HTML = [
              "<h3>📘 How to create &amp; sync variables</h3>",
              "<p>Name a GitHub <strong>Variable</strong> or <strong>Secret</strong> as <code>GL_&lt;flags&gt;__&lt;name&gt;</code>. It is synced to this GitLab project with the <code>GL_&lt;flags&gt;__</code> prefix stripped, so whatever follows the <code>__</code> becomes the GitLab key.</p>",
              "<h4>Flags</h4>",
              "<table>",
              "<thead><tr><th>Flag</th><th>Meaning</th></tr></thead>",
              "<tbody>",
              "<tr><td align=\"center\"><code>M</code></td><td>Masked</td></tr>",
              "<tr><td align=\"center\"><code>P</code></td><td>Protected</td></tr>",
              "<tr><td align=\"center\"><code>E</code></td><td>Expansion — enable <code>$</code> variable expansion (off by default)</td></tr>",
              "<tr><td align=\"center\"><code>H</code></td><td>Masked <em>and</em> hidden (implies masked; write-only, can only be set at creation)</td></tr>",
              "</tbody>",
              "</table>",
              "<p>Flags may be combined in any order — e.g. <code>GL_MP__…</code>, <code>GL_HPE__…</code>. Use an empty block <code>GL__NAME</code> for no flags.</p>",
              "<h4>Rules</h4>",
              "<ul>",
              "<li>An invalid flag block (unknown letter or duplicate) is tolerated — the variable still syncs, with all flags off.</li>",
              "<li>The name is everything after the <em>first</em> <code>__</code>, taken verbatim (underscores allowed; extra separator underscores are kept).</li>",
              "<li>Ignored: names without the <code>GL_</code> prefix, without <code>__</code>, or with an empty name.</li>",
              "<li>Masking follows the <em>flag</em>, not the source — a Secret without <code>M</code>/<code>H</code> syncs <strong>unmasked</strong>.</li>",
              "<li>Masked/hidden values (flags <code>M</code> and <code>H</code>) must:",
              "<ul>",
              "<li>be a single line (no newlines)</li>",
              "<li>be at least 8 characters long</li>",
              "<li>contain no whitespace</li>",
              "<li>use only Base64 characters (A-Z a-z 0-9 + / =) plus <code>@ : . ~ -</code></li>",
              "</ul>",
              "</li>",
              "</ul>",
              "<h4>Examples</h4>",
              "<table>",
              "<thead><tr><th>GitHub name</th><th>GitLab key</th><th>Result</th></tr></thead>",
              "<tbody>",
              "<tr><td><code>GL__DB_HOST</code></td><td><code>DB_HOST</code></td><td>no flags</td></tr>",
              "<tr><td><code>GL_M__DB_PASSWORD</code></td><td><code>DB_PASSWORD</code></td><td>masked</td></tr>",
              "<tr><td><code>GL_MP__API_KEY</code></td><td><code>API_KEY</code></td><td>masked + protected</td></tr>",
              "<tr><td><code>GL_H__SESSION_TOKEN</code></td><td><code>SESSION_TOKEN</code></td><td>masked + hidden</td></tr>",
              "</tbody>",
              "</table>"
            ].join("\n");

            // Collect the variables to sync, resolving the GitLab key + flags from the name.
            // Scanning both variables and secrets keeps the flags driven purely by the name.
            const toSync = [];
            for (const [sourceLabel, source] of [["variable", allGhVars], ["secret", allGhSecrets]]) {
              for (const [ghKey, value] of Object.entries(source)) {
                const parsed = parseGlKey(ghKey);
                if (parsed) {
                  toSync.push({ ghKey, value, source : sourceLabel, ...parsed });
                }
              }
            }

            console.log("");
            console.log(`ℹ️ Syncing ${toSync.length} GitHub variable(s) to GitLab CICD...`);
            console.log("------------------------------------");

            if (toSync.length === 0) {
              console.log("  ℹ️ No syncable GL_ variables found - will still check for stale variables to prune");
            }

            // Track the outcome of every candidate and pruned variable (for the job summary
            // report) and the failed ones (for the annotation + setFailed message).
            const results = [];
            const failed  = [];

            for (const { ghKey, glKey, value, masked, protected : isProtected, expansion, hidden, source } of toSync) {
              // GitLab requires a hidden variable to also be masked.
              const desiredMasked = masked || hidden;
              const displayValue  = desiredMasked ? "***" : value;
              // GitLab stores the inverse of expansion as 'raw' (raw=true means no expansion).
              const raw = !expansion;

              // Options shared by create and update. 'masked_and_hidden' is create-only
              // (the hidden visibility cannot be toggled afterwards), so it is added to the
              // create body alone; updates send the resolved 'masked' value instead.
              const sharedOptions = { ...baseVariableOptions, protected : isProtected, raw };

              const result = {
                source,
                ghKey,
                glKey,
                masked    : desiredMasked,
                protected : isProtected,
                expanded  : expansion,
                hidden,
                status    : "unchanged",
                reason    : ""
              };

              try {
                const existing = await glRequest("GET", `/projects/${PROJECT_ID}/variables/${glKey}`);

                if (existing.status === 404) {
                  console.log(`  → Variable not found - creating '${glKey}' (from '${ghKey}', masked=${desiredMasked}, hidden=${hidden}, protected=${isProtected}, expanded=${expansion})`);
                  const createBody = { key : glKey, value : value, ...sharedOptions };
                  if (hidden) {
                    createBody.masked_and_hidden = true;   // implies masked
                  } else {
                    createBody.masked = desiredMasked;
                  }
                  await writeVariable("create", "POST", `/projects/${PROJECT_ID}/variables`, createBody);
                  result.status = "created";
                  console.log(`  ✓ Variable created : ${glKey}=${displayValue}`);
                } else if (existing.ok) {
                  const isHiddenNow = existing.data.hidden === true;

                  // Hidden visibility is fixed at creation - it cannot be toggled via the API.
                  if (isHiddenNow !== hidden) {
                    throw new Error(`Cannot change hidden visibility (${isHiddenNow} -> ${hidden}) via API - delete and recreate the variable in GitLab`);
                  }

                  const maskedChanged    = existing.data.masked !== desiredMasked;
                  const protectedChanged = existing.data.protected !== isProtected;
                  const rawChanged       = existing.data.raw !== raw;
                  // Hidden variables never return their value, so it cannot be compared -
                  // refresh it on every run to keep GitLab in sync with GitHub.
                  const valueChanged     = hidden ? true : existing.data.value !== value;

                  if (!valueChanged && !maskedChanged && !protectedChanged && !rawChanged) {
                    result.status = "unchanged";
                    console.log(`  ✓ Variable already up to date : ${glKey}`);
                  } else {
                    const reasons = [];
                    if (valueChanged)     reasons.push(hidden ? "value refreshed (hidden, cannot verify)" : "value changed");
                    if (maskedChanged)    reasons.push(`masked ${existing.data.masked} -> ${desiredMasked}`);
                    if (protectedChanged) reasons.push(`protected ${existing.data.protected} -> ${isProtected}`);
                    if (rawChanged)       reasons.push(`expanded ${existing.data.raw !== true} -> ${expansion}`);
                    console.log(`  → Variable differs (${reasons.join(", ")}) - updating '${glKey}'`);
                    await writeVariable("update", "PUT", `/projects/${PROJECT_ID}/variables/${glKey}`, {
                      value  : value,
                      ...sharedOptions,
                      masked : desiredMasked
                    });
                    result.status = "updated";
                    console.log(`  ✓ Variable updated : ${glKey}=${displayValue}`);
                  }
                } else {
                  throw new Error(`Unexpected response fetching variable -> ${existing.status} ${describeGlError(existing.data)}`);
                }
              } catch (error) {
                result.status = "failed";
                result.reason = error.message;
                // Keep the full reason (including any GitLab error detail) per variable.
                failed.push({ ghKey, glKey, reason : error.message });
                core.error(`Failed to sync variable [GitHub: '${ghKey}' -> GitLab: '${glKey}']\n${error.message}`);
              }

              results.push(result);
            }

            // ─────────────────────────────────────────────
            // Prune stale project-level variables
            // ─────────────────────────────────────────────
            // A variable is "stale" if it exists as a project-level CICD variable but is
            // neither a current sync candidate nor reserved. Deletion is limited to
            // project-level variables: the project variables endpoint never returns
            // group-level (inherited) variables, so those are always left untouched.
            // Reserved variables are never pruned. The list is received from the
            // 'Sync Reserved GitLab CICD Variables' step via its 'reserved_keys' output
            // (a JSON array), rather than hard-coded here.
            const RESERVED_KEYS = new Set(JSON.parse(process.env.RESERVED_KEYS || "[]"));
            const desiredKeys   = new Set(toSync.map((v) => v.glKey));

            async function listProjectVariables() {
              const all = [];
              const perPage = 100;
              for (let page = 1; ; page++) {
                const res = await glRequest("GET", `/projects/${PROJECT_ID}/variables?per_page=${perPage}&page=${page}`);
                if (!res.ok) {
                  throw new Error(`Failed to list project variables -> ${res.status} ${describeGlError(res.data)}`);
                }
                const batch = Array.isArray(res.data) ? res.data : [];
                all.push(...batch);
                if (batch.length < perPage) break;
              }
              return all;
            }

            console.log("");
            console.log("ℹ️ Pruning stale project-level variables...");
            console.log("------------------------------------");

            try {
              const projectVariables = await listProjectVariables();
              for (const variable of projectVariables) {
                const key = variable.key;
                if (RESERVED_KEYS.has(key)) {
                  continue;   // reserved - never pruned
                }
                if (desiredKeys.has(key)) {
                  continue;   // still a sync candidate - keep
                }

                console.log(`  → Deleting stale project variable '${key}'`);
                const del = await glRequest("DELETE", `/projects/${PROJECT_ID}/variables/${encodeURIComponent(key)}`);
                if (del.ok || del.status === 404) {
                  results.push({
                    source    : "gitlab",
                    ghKey     : "—",
                    glKey     : key,
                    masked    : variable.masked === true,
                    protected : variable.protected === true,
                    expanded  : variable.raw !== true,
                    hidden    : variable.hidden === true,
                    status    : "deleted",
                    reason    : ""
                  });
                  console.log(`  ✓ Deleted stale variable : ${key}`);
                } else {
                  const reason = `Failed to delete stale variable -> ${del.status} ${describeGlError(del.data)}`;
                  results.push({ source : "gitlab", ghKey : "—", glKey : key, masked : false, protected : false, expanded : false, hidden : false, status : "failed", reason });
                  failed.push({ ghKey : "(stale)", glKey : key, reason });
                  core.error(`Failed to delete stale variable [GitLab: '${key}']\n${reason}`);
                }
              }
            } catch (error) {
              failed.push({ ghKey : "—", glKey : "(prune)", reason : error.message });
              core.error(`Failed to prune stale project variables\n${error.message}`);
            }

            // ─────────────────────────────────────────────
            // Job summary: report on every sync candidate
            // ─────────────────────────────────────────────
            // Single source of truth for statuses: drives counting, the overview table
            // columns, the per-row label, and the failures-first sort order.
            const STATUS_META = [
              { key : "failed",    label : "❌ Failed"    },
              { key : "created",   label : "➕ Created"   },
              { key : "updated",   label : "♻️ Updated"   },
              { key : "deleted",   label : "🗑️ Deleted"   },
              { key : "unchanged", label : "✓ Unchanged" }
            ];
            const statusLabel = Object.fromEntries(STATUS_META.map((s) => [s.key, s.label]));
            const statusOrder = Object.fromEntries(STATUS_META.map((s, i) => [s.key, i]));

            // Friendly labels for the Source column.
            const SOURCE_LABEL = {
              variable : "GitHub Actions variable",
              secret   : "GitHub Actions secret",
              gitlab   : "GitLab CICD variable"
            };

            const counts = Object.fromEntries(STATUS_META.map((s) => [s.key, 0]));
            for (const r of results) { counts[r.status]++; }

            const yesNo = (flag) => (flag ? "✓" : "—");
            const headerCells = (labels) => labels.map((label) => ({ data : label, header : true }));

            const detailRows = results
              // Sort by status (failures first) then by GitLab key - easier to scan.
              .slice()
              .sort((a, b) => (statusOrder[a.status] - statusOrder[b.status]) || a.glKey.localeCompare(b.glKey))
              .map((r) => [
                SOURCE_LABEL[r.source] || r.source,
                `<code>${r.ghKey}</code>`,
                `<code>${r.glKey}</code>`,
                yesNo(r.masked),
                yesNo(r.protected),
                yesNo(r.expanded),
                yesNo(r.hidden),
                statusLabel[r.status] || r.status
              ]);

            core.summary
              .addRaw("<br><br>", true)
              .addHeading("GitHub → GitLab CICD Variable Sync", 2);

            if (results.length === 0) {
              core.summary.addRaw("No GitHub variables or secrets matched the <code>GL_&lt;flags&gt;__&lt;name&gt;</code> naming convention, and there were no stale project variables to remove.", true);
            } else {
              core.summary
                .addTable([
                  headerCells(["Total", ...STATUS_META.map((s) => s.label)]),
                  [String(results.length), ...STATUS_META.map((s) => String(counts[s.key]))]
                ])
                .addHeading("Details", 3)
                .addTable([
                  headerCells(["Source", "GitHub name", "GitLab key", "Masked", "Protected", "Expanded", "Hidden", "Result"]),
                  ...detailRows
                ]);
            }

            if (counts.failed > 0) {
              core.summary.addHeading("Failure details", 3);
              core.summary.addRaw(
                failed
                  .map(({ ghKey, glKey, reason }) =>
                    `- \`${ghKey}\` → \`${glKey}\`\n  \`\`\`\n  ${reason.replace(/\n/g, "\n  ")}\n  \`\`\``
                  )
                  .join("\n"),
                true
              );
            }

            core.summary.addRaw(CONVENTION_HTML, true);

            await core.summary.write();

            if (failed.length > 0) {
              const failedList = failed
                .map(({ ghKey, glKey, reason }) =>
                  `- GitHub: '${ghKey}' -> GitLab: '${glKey}'\n    ${reason.replace(/\n/g, "\n    ")}`
                )
                .join("\n");
              core.setFailed(
                `\n❌ Failed to sync ${failed.length} of ${toSync.length} GitHub variable(s) to GitLab CICD:\n${failedList}`
              );
            }

      # --------------------------------------------------
      # Step 12: Prepare Mirror Clone
      # --------------------------------------------------
      # Bare mirror clone of the GitHub repo + the GitLab remote. Shared by the
      # (optional) auto-build step and the full mirror push that follow. The
      # 'gitlab' remote (with its token URL) persists in repo.git/config across
      # steps, so later steps only 'cd repo.git' and push.

      - name: Prepare Mirror Clone
        id: prepare_mirror_clone
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_path != '' }}
        env:
          GITLAB_HOST:      ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_PATH:     ${{ steps.ensure_gitlab_project_exists.outputs.project_path }}
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "🚀 Preparing GitHub → GitLab Mirror"
          echo "=================================================="
          echo "Repository    : ${{ github.repository }}"
          echo "GitLab Target : ${PROJECT_PATH}"
          echo ""

          GITHUB_URL="https://x-access-token:${{ steps.generate_github_app_token.outputs.token }}@github.com/${{ github.repository }}.git"
          GITLAB_URL="https://oauth2:${GITLAB_API_TOKEN}@${GITLAB_HOST#https://}/${PROJECT_PATH}.git"

          echo "Cloning repository in mirror mode..."
          git clone --mirror "$GITHUB_URL" repo.git

          cd repo.git

          echo "Adding GitLab remote..."
          git remote add gitlab "$GITLAB_URL"

      # --------------------------------------------------
      # Step 13: Sync Selected Branch & Report Image
      # --------------------------------------------------
      # Owns the DISPATCHED branch: pushes it to GitLab (fast-forward by default,
      # --force only when force_push is ticked) so its pipeline is created. The
      # build auto-runs when the head commit message contains [auto-build]
      # (GitLab rule: $CI_COMMIT_MESSAGE =~ /\[auto-build\]/). For container-build
      # repos it then reports the ahead-of-time image reference. The mirror step
      # handles all OTHER compliant branches (it excludes this one).

      - name: Sync Selected Branch & Report Image
        id: sync_selected_branch
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_path != '' }}
        env:
          GITLAB_HOST:      ${{ secrets.GITLAB_HOST || vars.GITLAB_HOST }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          PROJECT_ID:       ${{ steps.ensure_gitlab_project_exists.outputs.project_id }}
          FORCE_PUSH:       ${{ inputs.force_push }}
          # Centralized definitions that produce a container image (space-separated).
          CONTAINER_BUILD_DEFINITIONS: "quarkus-maven-native-app spring-maven-native-app"
        run: |
          set -euo pipefail
          cd repo.git

          BRANCH="${GITHUB_REF_NAME}"

          # Force-push only when force_push is ticked; otherwise fast-forward-only.
          FORCE=()
          [ "${FORCE_PUSH:-false}" = "true" ] && FORCE=(--force)

          # ------------------------------------------------------------------
          # finish <exit-code>: write this step's ENTIRE summary section, then exit.
          # ------------------------------------------------------------------
          OUTCOME=""
          TOKEN_PRESENT="no"   # head commit message contains [auto-build]
          SYNC_NOTE=""         # set after the push attempt (pushed vs already up to date)

          finish() {
            local code="$1"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                printf '\n\n<br><br>\n\n'
                printf '## Selected Branch — Sync & Image\n\n'
                case "$OUTCOME" in
                  not-a-branch)
                    printf 'ℹ️ Dispatched on a %s (`%s`), not a branch — nothing to sync or build here.\n' "$GITHUB_REF_TYPE" "$BRANCH" ;;
                  non-compliant)
                    printf '### ⚠️ Not synced — `%s`\n\n' "$BRANCH"
                    printf 'Branch `%s` is not a compliant branch name, so it is not synced to GitLab and would not build.\n\n' "$BRANCH"
                    printf 'Use a standard branch name, for example:\n\n'
                    printf -- '- `main`\n- `feature/*`\n- `fix/*`\n- `chore/*`\n' ;;
                  push-failed)
                    printf '### ❌ Push rejected — `%s`\n\n' "$BRANCH"
                    printf 'The push of branch `%s` to GitLab was rejected — it likely diverged on GitLab (pushes are fast-forward-only unless `force_push` is ticked).\n\n' "$BRANCH"
                    printf 'Re-run the workflow with **force_push** ticked to overwrite, after confirming it is safe.\n' ;;
                  no-ci)
                    printf '### ℹ️ Synced, no pipeline — `%s`\n\n' "$BRANCH"
                    printf '%s No `.gitlab-ci.yml` on the branch, so no pipeline runs and there is no image.\n' "$SYNC_NOTE" ;;
                  non-container)
                    printf '### ℹ️ Synced, no container image — `%s`\n\n' "$BRANCH"
                    printf '%s This repo uses a non-container build definition (`%s`), so there is no container image URL.\n\n' "$SYNC_NOTE" "${DEFS:-none}"
                    printf 'Container image URLs are derived only for these container-build definitions (as of now): %s.\n' "$CTLIST" ;;
                  no-pom)
                    printf '### ⚠️ Synced, no image reference — `%s`\n\n' "$BRANCH"
                    printf '%s No `pom.xml` on the branch, so the image reference cannot be derived and a container build would fail.\n' "$SYNC_NOTE" ;;
                  bad-version)
                    printf '### ⚠️ Synced, no image reference — `%s`\n\n' "$BRANCH"
                    printf '%s Could not read a literal semver `project.version` from `pom.xml` (got `%s`), so the image reference cannot be derived.\n' "$SYNC_NOTE" "${VERSION:-empty}" ;;
                  no-registry)
                    printf '### ⚠️ Synced, no image reference — `%s`\n\n' "$BRANCH"
                    printf '%s Could not read `container_registry_image_prefix` from the GitLab API, so the image reference cannot be derived.\n' "$SYNC_NOTE" ;;
                  success)
                    printf '### 📦 Container image — `%s`\n\n' "$BRANCH"
                    printf '%s ' "$SYNC_NOTE"
                    if [ "$TOKEN_PRESENT" = "yes" ]; then
                      printf 'The head commit contains `[auto-build]`, so the build runs **automatically**. It will be published at:\n\n'
                    else
                      printf 'The head commit has no `[auto-build]` token, so the build stays **manual**. To make it build automatically, put `[auto-build]` in the commit message — for example:\n\n'
                      printf '```bash\n'
                      printf '# include the token in your next commit\n'
                      printf 'git commit -m "your message [auto-build]"\n\n'
                      printf '# or trigger a build on the current tree with an empty commit\n'
                      printf 'git commit --allow-empty -m "trigger build [auto-build]"\n\n'
                      printf '# then push to GitHub and re-run this mirror workflow\n'
                      printf 'git push origin %s\n' "$BRANCH"
                      printf '```\n\n'
                      printf 'You can also start the build job manually from the pipeline. If/when built, it will be published at:\n\n'
                    fi
                    printf '> 📋 **Image reference** — hover the box below and click the copy icon:\n\n'
                    printf '```text\n%s\n```\n\n' "$IMAGE_URL"
                    printf '> ⚠️ Do **NOT** assume this image exists yet — it is a predicted reference. Confirm it in the Container Registry (or wait for the build/publish job to finish) before pulling or deploying.\n\n'
                    printf '#### ℹ️ How this reference was computed\n\n'
                    printf 'It mirrors exactly what the `build-native-image` job tags and pushes:\n\n'
                    printf '| Part | Value | Source |\n'
                    printf '| --- | --- | --- |\n'
                    printf '| Registry | `%s` | `container_registry_image_prefix` from the GitLab project API (= `$CI_REGISTRY_IMAGE`) |\n' "$REGISTRY_IMAGE"
                    printf '| Version | `%s` | `project.version` in `pom.xml` |\n' "$VERSION"
                    printf '| Commit SHA | `%s` | first 8 chars of the branch-tip commit SHA |\n' "$SHORT_SHA"
                    printf '| Branch slug | `%s` | branch name with slashes (`/`) replaced by hyphens (`-`), cut to 20 chars |\n' "$BRANCH_SLUG"
                    printf '| **Tag** | `%s` | `v<version>-<commit-sha>-<branch-slug>` |\n\n' "$IMAGE_TAG"
                    printf '**Suggested use:** pre-fill deployment manifests, release notes, or a `docker pull` command now — but keep it provisional until the build/publish job is green.\n' ;;
                esac
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          }

          # 1) Only branches are synced here (tags are not pushed by the mirror).
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "ℹ️ Dispatched on a ${GITHUB_REF_TYPE} ('${BRANCH}'), not a branch."
            OUTCOME="not-a-branch"; finish 0
          fi

          # 2) Non-compliant branch names are not synced (and never build).
          if ! printf '%s' "$BRANCH" | grep -qE "$COMPLIANT_BRANCH_REGEX"; then
            echo "::warning::Branch '${BRANCH}' is not a compliant branch name - not syncing."
            OUTCOME="non-compliant"; finish 0
          fi

          # 3) Sync the selected branch to GitLab. This step OWNS it (the mirror step
          # excludes it). Fast-forward by default; --force only when force_push. Skip
          # when GitLab already has this exact commit (no-op => no new pipeline).
          LOCAL_SHA="$(git rev-parse "refs/heads/${BRANCH}")"
          REMOTE_SHA="$(git ls-remote gitlab "refs/heads/${BRANCH}" 2>/dev/null | awk 'NR==1{print $1}')"
          if [ -n "$REMOTE_SHA" ] && [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
            echo "ℹ️ Branch '${BRANCH}' already up to date on GitLab (${LOCAL_SHA}); not pushing."
            SYNC_NOTE="Branch \`${BRANCH}\` was already up to date on GitLab (no new pipeline created this run)."
          else
            echo "Pushing branch '${BRANCH}' to GitLab (force_push=${FORCE_PUSH:-false})..."
            if ! git push "${FORCE[@]}" gitlab "refs/heads/${BRANCH}:refs/heads/${BRANCH}"; then
              echo "::error::Push of '${BRANCH}' rejected (a diverged branch needs force_push)."
              OUTCOME="push-failed"; finish 1
            fi
            SYNC_NOTE="Branch \`${BRANCH}\` was pushed to GitLab."
          fi

          # 4) Auto-build token in the head commit?
          HEAD_MSG="$(git log -1 --format=%B "refs/heads/${BRANCH}" 2>/dev/null || true)"
          if printf '%s' "$HEAD_MSG" | grep -qF '[auto-build]'; then
            TOKEN_PRESENT="yes"; echo "ℹ️ Head commit contains [auto-build] - build auto-runs."
          else
            echo "ℹ️ No [auto-build] token in head commit - build stays manual."
          fi

          # 5) Image reference (container-build repos only).
          CI_FILE="$(git show "refs/heads/${BRANCH}:.gitlab-ci.yml" 2>/dev/null || true)"
          if [ -z "$CI_FILE" ]; then
            echo "ℹ️ No .gitlab-ci.yml on '${BRANCH}'."
            OUTCOME="no-ci"; finish 0
          fi

          # Which centralized definition does this repo include? Take every
          # non-comment `file: <name>.gitlab-ci.yml`, reduce to its base <name>.
          # TODO: also handle CI/CD component includes ( - component: .../<name>@<ref> ).
          DEFS="$(printf '%s\n' "$CI_FILE" \
            | grep -E '^[[:space:]]*file:' \
            | grep -vE '^[[:space:]]*#' \
            | sed -E 's/.*file:[[:space:]]*//; s/["'\'']//g' \
            | sed -E 's#.*/##; s/\.gitlab-ci\.yml$//' || true)"

          MATCHED=""
          for d in $DEFS; do
            for c in $CONTAINER_BUILD_DEFINITIONS; do
              if [ "$d" = "$c" ]; then MATCHED="$d"; break 2; fi
            done
          done

          if [ -z "$MATCHED" ]; then
            echo "ℹ️ '${BRANCH}' uses a non-container definition (${DEFS:-none})."
            CTLIST=""
            for c in $CONTAINER_BUILD_DEFINITIONS; do CTLIST="${CTLIST:+$CTLIST, }\`$c\`"; done
            OUTCOME="non-container"; finish 0
          fi
          echo "ℹ️ Container definition detected: ${MATCHED}"

          POM="$(git show "refs/heads/${BRANCH}:pom.xml" 2>/dev/null || true)"
          if [ -z "$POM" ]; then
            echo "::warning::No pom.xml on '${BRANCH}'."
            OUTCOME="no-pom"; finish 0
          fi

          # project.version = first <version> after the top <artifactId>, outside
          # the <parent> block (Maven can't run here - this is a git-only runner).
          VERSION="$(printf '%s\n' "$POM" | awk '
            /<parent>/{p=1} /<\/parent>/{p=0; next}
            p{next}
            /<artifactId>/{seen=1}
            seen && match($0, /<version>[^<]+<\/version>/){
              v=substr($0,RSTART,RLENGTH); gsub(/<[^>]+>/,"",v); print v; exit
            }')"

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$'; then
            echo "::warning::Could not parse a literal semver project.version from pom.xml (got '${VERSION:-empty}')."
            OUTCOME="bad-version"; finish 0
          fi

          # Image tag pattern for a branch pipeline (matches build-native-image):
          #   v<version>-<short_sha(8)>-<branch '/'->'-' cut to 20>
          SHORT_SHA="$(git rev-parse --short=8 "refs/heads/${BRANCH}")"
          BRANCH_SLUG="$(printf '%s' "$BRANCH" | tr '/' '-' | cut -c1-20)"
          IMAGE_TAG="v${VERSION}-${SHORT_SHA}-${BRANCH_SLUG}"

          # REGISTRY_IMAGE == $CI_REGISTRY_IMAGE, read authoritatively from the
          # GitLab project API (no need to guess the registry host).
          REGISTRY_IMAGE="$(curl -sS --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            "${GITLAB_HOST}/api/v4/projects/${PROJECT_ID}" \
            | sed -n 's/.*"container_registry_image_prefix"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"

          if [ -z "$REGISTRY_IMAGE" ]; then
            echo "::warning::Could not read container_registry_image_prefix from the GitLab API."
            OUTCOME="no-registry"; finish 0
          fi

          IMAGE_URL="${REGISTRY_IMAGE}:${IMAGE_TAG}"
          echo "📦 Image reference: ${IMAGE_URL} (auto-build token: ${TOKEN_PRESENT})"
          OUTCOME="success"; finish 0

      # --------------------------------------------------
      # Step 14: Mirror Repository To GitLab
      # --------------------------------------------------

      - name: Mirror Repository To GitLab
        id: execute_gitlab_mirror_push
        if: ${{ steps.ensure_gitlab_project_exists.outputs.project_path != '' }}
        run: |
          set -euo pipefail
          cd repo.git

          # This step force-syncs GitHub -> GitLab for ALL compliant branches
          # EXCEPT the dispatched one, which the "Sync Selected Branch" step already
          # pushed (with the force_push-controlled behavior).

          push_with_retry() {
            for i in {1..5}; do
              echo "Attempt $i of 5..."
              if git push "$@"; then echo "✅ Push succeeded"; return 0; fi
              echo "⚠️ Attempt $i failed"
              sleep 5
            done
            return 1
          }

          # Sync COMPLIANT BRANCHES ONLY, and converge GitLab to match.
          # - Only branches whose names match the definitions' workflow: rules are
          #   pushed; non-compliant branches are never synced.
          # - GitLab branches that are non-compliant, or no longer exist on GitHub,
          #   are deleted so both sides converge.
          # - Explicit refspecs are used (never `git push --mirror`/wildcard prune):
          #   they only ever touch refs/heads/*, so local refs/remotes/gitlab/*
          #   tracking refs and GitLab-managed refs (refs/pipelines/*, ...) are left
          #   alone.
          # - Tags are intentionally NOT pushed: release tags originate on GitLab
          #   (create-release-tag) and sync GitLab -> GitHub; pushing them back would
          #   reverse that and hit protected-tag rules.
          # Local branches (this mirror clone of GitHub).
          mapfile -t LOCAL_BRANCHES < <(git for-each-ref --format='%(refname:short)' refs/heads)

          # Trackers for the job summary.
          SYNCED=()            # compliant GitHub branches pushed to GitLab
          SKIPPED=()           # non-compliant GitHub branches (never synced)
          DEL_NONCOMPLIANT=()  # non-compliant branches deleted on GitLab
          DEL_STALE=()         # compliant branches deleted on GitLab (gone from GitHub)

          # Classify local branches: compliant -> push, non-compliant -> skip.
          # Exclude the dispatched branch - the "Sync Selected Branch" step owns it.
          push_specs=()
          for br in "${LOCAL_BRANCHES[@]}"; do
            if [ "$br" = "${GITHUB_REF_NAME:-}" ]; then
              echo "  - selected branch handled by the sync step; not mirrored here: $br"
              continue
            fi
            if printf '%s' "$br" | grep -qE "$COMPLIANT_BRANCH_REGEX"; then
              push_specs+=("refs/heads/${br}:refs/heads/${br}")
              SYNCED+=("$br")
            else
              echo "  - skip non-compliant branch (not synced): $br"
              SKIPPED+=("$br")
            fi
          done

          # Classify remote branches to delete: non-compliant, or compliant but no
          # longer present on GitHub (stale).
          del_specs=()
          while IFS= read -r rbr; do
            [ -n "$rbr" ] || continue
            if printf '%s' "$rbr" | grep -qE "$COMPLIANT_BRANCH_REGEX"; then
              printf '%s\n' "${LOCAL_BRANCHES[@]}" | grep -qxF "$rbr" && continue
              echo "  - will delete GitLab branch (stale, gone from GitHub): $rbr"
              DEL_STALE+=("$rbr")
            else
              echo "  - will delete GitLab branch (non-compliant): $rbr"
              DEL_NONCOMPLIANT+=("$rbr")
            fi
            del_specs+=(":refs/heads/${rbr}")
          done < <(git ls-remote --heads gitlab | sed 's#.*refs/heads/##')

          # 1) DELETE first. Non-fatal: a refused deletion (e.g. a protected ref) is
          #    recorded and surfaced, but does not stop the mirror.
          DELETE_STATUS="none"   # none | ok | failed
          if [ "${#del_specs[@]}" -gt 0 ]; then
            echo "Deleting ${#del_specs[@]} branch(es) from GitLab..."
            if push_with_retry gitlab "${del_specs[@]}"; then
              DELETE_STATUS="ok"
            else
              DELETE_STATUS="failed"
              echo "::warning::One or more branches could not be deleted (they may be protected)."
            fi
          else
            echo "No branches to delete on GitLab."
          fi

          # 2) PUSH second. On failure do NOT exit yet - record it and defer the
          #    disruption until after the job summary is written.
          PUSH_STATUS="none"     # none | ok | failed
          if [ "${#push_specs[@]}" -gt 0 ]; then
            echo "Pushing ${#push_specs[@]} compliant branch(es)..."
            if push_with_retry --force gitlab "${push_specs[@]}"; then
              PUSH_STATUS="ok"
            else
              PUSH_STATUS="failed"
              echo "::error::Compliant branch push failed after multiple attempts."
            fi
          else
            echo "No compliant branches to push."
          fi

          # ------------------------------------------------------------------
          # Job summary — one cohesive section per branch category: a short
          # description, a one-row count table, and the branch names with copy
          # buttons (row-level "copy all" + one per branch). Fenced code blocks
          # are the only Markdown element GitHub gives a copy button.
          # ------------------------------------------------------------------
          emit_category() {
            # $1 heading  $2 description  $3 source  $4 reason ; rest = branch names
            local heading="$1" desc="$2" source="$3" reason="$4"; shift 4
            printf '### %s\n\n' "$heading"
            printf '%s\n\n' "$desc"
            printf '| Source | Reason | Count |\n'
            printf '| --- | --- | --: |\n'
            printf '| %s | %s | %s |\n\n' "$source" "$reason" "$#"
            if [ "$#" -gt 0 ]; then
              printf 'Copy all:\n\n'
              printf '```text\n'
              printf '%s\n' "$@"
              printf '```\n\n'
              printf 'Copy individually:\n\n'
              local b
              for b in "$@"; do printf '```text\n%s\n```\n\n' "$b"; done
            else
              printf '_No branches in this category._\n\n'
            fi
          }

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '\n\n<br><br>\n\n'
              printf '## Mirror Repository To GitLab\n\n'
              printf '### 🔁 Branch sync summary — `%s`\n\n' "${GITHUB_REPOSITORY:-repository}"
              printf 'This run mirrored **branches** from GitHub to GitLab. Each section below is one outcome — a one-line count table plus the affected branch names (with copy buttons).\n\n'

              # Conditional push/delete status notes.
              if [ "$PUSH_STATUS" = "failed" ]; then
                printf '> ❌ **Compliant branch push FAILED** after multiple attempts — check the step log (e.g. token/permissions or a protected ref).\n\n'
              elif [ "$PUSH_STATUS" = "ok" ]; then
                printf '> ✅ Compliant branches pushed successfully.\n\n'
              fi
              if [ "$DELETE_STATUS" = "failed" ]; then
                printf '> ⚠️ **One or more branch deletions FAILED** (the branches may be protected) — check the step log.\n\n'
              fi

              emit_category "✅ Synced to GitLab" \
                "Compliant GitHub branches pushed to GitLab." \
                "GitHub" "compliant" "${SYNCED[@]}"
              emit_category "⏭️ Skipped (not synced)" \
                "Non-compliant GitHub branches — never pushed, so they do not build." \
                "GitHub" "non-compliant" "${SKIPPED[@]}"
              emit_category "🗑️ Deleted from GitLab (non-compliant)" \
                "GitLab branches removed because their name is not compliant." \
                "GitLab" "non-compliant" "${DEL_NONCOMPLIANT[@]}"
              emit_category "🗑️ Deleted from GitLab (stale)" \
                "GitLab branches removed because they no longer exist on GitHub." \
                "GitLab" "stale" "${DEL_STALE[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Deferred disruption: now that the summary is written, fail the job if
          # the compliant-branch push failed.
          if [ "$PUSH_STATUS" = "failed" ]; then
            echo ""
            echo "❌ ERROR: Compliant branch push failed after multiple attempts."
            echo "  - A branch may have diverged on GitLab (rejected because pushes are fast-forward-only by default)."
            echo "  - Re-run with the force_push checkbox ticked to overwrite (after confirming it is safe), or verify token/permissions."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "✅ GitHub → GitLab Mirror Completed Successfully"
          echo "=================================================="
