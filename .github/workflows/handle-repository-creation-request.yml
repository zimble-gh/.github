name: Handle Repository Creation Request

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  provision_repository:
    name: Provision Repository
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'repo-creation-request') &&
      startsWith(github.event.issue.title, '[REPO-CREATION-REQUEST]')
    runs-on: ubuntu-latest
    outputs:
      validate_status: ${{ steps.validate_request.outputs.status }}
      validate_success: ${{ steps.validate_request.outputs.success }}
      validate_error: ${{ steps.validate_request.outputs.error }}
      validate_warning: ${{ steps.validate_request.outputs.warning }}
      validate_info: ${{ steps.validate_request.outputs.info }}

      duplicate_status: ${{ steps.check_repository_existence.outputs.status }}
      duplicate_success: ${{ steps.check_repository_existence.outputs.success }}
      duplicate_error: ${{ steps.check_repository_existence.outputs.error }}

      fork_status: ${{ steps.verify_fork_source.outputs.status }}
      fork_success: ${{ steps.verify_fork_source.outputs.success }}
      fork_error: ${{ steps.verify_fork_source.outputs.error }}

      enterprise_status: ${{ steps.verify_enterprise_plan.outputs.status }}
      enterprise_success: ${{ steps.verify_enterprise_plan.outputs.success }}
      enterprise_error: ${{ steps.verify_enterprise_plan.outputs.error }}

      create_status: ${{ steps.create_repository.outputs.status }}
      create_success: ${{ steps.create_repository.outputs.success }}
      create_error: ${{ steps.create_repository.outputs.error }}

      topics_status: ${{ steps.apply_repository_topics.outputs.status }}
      topics_success: ${{ steps.apply_repository_topics.outputs.success }}
      topics_error: ${{ steps.apply_repository_topics.outputs.error }}

      metadata_status: ${{ steps.set_repository_metadata.outputs.status }}
      metadata_success: ${{ steps.set_repository_metadata.outputs.success }}
      metadata_error: ${{ steps.set_repository_metadata.outputs.error }}

      org_vars_status: ${{ steps.copy_organization_variables.outputs.status }}
      org_vars_success: ${{ steps.copy_organization_variables.outputs.success }}
      org_vars_error: ${{ steps.copy_organization_variables.outputs.error }}
      org_vars_info: ${{ steps.copy_organization_variables.outputs.info }}
      org_vars_warning: ${{ steps.copy_organization_variables.outputs.warning }}

      secrets_status: ${{ steps.sync_repository_secrets.outputs.status }}
      secrets_success: ${{ steps.sync_repository_secrets.outputs.success }}
      secrets_error: ${{ steps.sync_repository_secrets.outputs.error }}

      # Exposed at job level (rather than just used step-to-step) so the separate
      # align_forked_repository_settings job below can read them via `needs.provision_repository.outputs`.
      final_name: ${{ steps.validate_request.outputs.final_name }}
      description: ${{ steps.validate_request.outputs.description }}
      visibility: ${{ steps.validate_request.outputs.visibility }}
      fork_source_owner: ${{ steps.validate_request.outputs.fork_source_owner }}
      fork_source_repo: ${{ steps.validate_request.outputs.fork_source_repo }}
      fork_source_visibility: ${{ steps.verify_fork_source.outputs.source_visibility }}
      org_forking_needs_retry_disable: ${{ steps.create_repository.outputs.org_forking_needs_retry_disable }}

    steps:
      # Checked out purely so "Validate Issue Input" can read the issue template
      # (.github/ISSUE_TEMPLATE/repository_creation_request.yml) straight off disk
      # (fs.readFileSync) instead of spending a GitHub REST API call (repos.getContent) on it every
      # run - a plain shallow checkout of this small repo is cheaper and doesn't touch API rate
      # limits at all.
      - name: Checkout Repository
        uses: actions/checkout@v5

      # TODO: try actions/create-github-app-token@v3 in place of tibdex/github-app-token@v2
      #? tibdex/github-app-token@v2 is archived and perhaps lacks maintenance
      #? tibdex/github-app-token@v2 is running on Node.js 20 for which github runner support will be removed on September 16th, 2026.
      #? tibdex/github-app-token@v2 action will be forced to run with Node.js 24 by default starting June 2nd, 2026.
      #? tibdex/github-app-token@v2 may encounter unknown issues with Node.js 24. Need to test this.
      #? actions/create-github-app-token@v3 requires app client-id but the token obtained expires too soon.
      #? actions/create-github-app-token@v3 has app-id parameter also that parameter may provide longer living tokens. Need to dive more and explore.
      #? app-id parameter with actions/create-github-app-token@v3 is deprecated. So need to find way to increase the token validity.
      - name: Generate GitHub App Token
        id: generate_github_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY || vars.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Validate Issue Input
        id: validate_request
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body;

            function extract(label) {
              const regex  = new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=\\n###|$)`);
              const match  = body.match(regex);
              return match ? match[1].trim() : null;
            }

            function isChecked(block, label) {
              return block?.includes(`- [x] ${label}`);
            }

            // Guard against issue-template / workflow drift: every field this script parses is
            // expected to render as a literal "### <label>" heading in the issue body (this is how
            // GitHub issue forms render dropdown/input/textarea answers, regardless of whether the
            // field was left blank). If a template edit renames or removes one of these labels
            // without this script being updated to match, the heading will be entirely absent from
            // the body - which is a different situation from a requester simply leaving a field
            // blank (that still produces the heading, just with no/"_No response_" content below
            // it). Detect that drift explicitly so it surfaces as an obvious platform-team issue
            // rather than a confusing "Missing: <field>" message aimed at the requester.
            const TEMPLATE_FIELD_LABELS = [
              "Initiative \\(Optional\\)",
              "Product Line",
              "Aspect / Domain",
              "Repository Name",
              "Project Type",
              "Repository Description \\(Max\\. 350 characters\\)",
              "Repository Visibility",
              "Source Repository URL \\(Optional - for forking\\)",
              "Tenant Name \\(Optional\\)"
              // "Repository Options \\(Optional\\)" - removed along with the README-init field/logic
              //   (see the fork feature note near the top of the file); no longer rendered by the
              //   issue template, so it must not be checked here.
            ];

            function headingExists(label) {
              return new RegExp(`^### ${label}`, "m").test(body);
            }

            const missingHeadings = TEMPLATE_FIELD_LABELS
              .filter(label => !headingExists(label))
              .map(label => label.replace(/\\/g, ""));

            if (missingHeadings.length > 0) {
              const msg = `🛠️ Template Mismatch Detected (this is not a requester error)

            This workflow could not find the following expected field heading(s) in the issue body:

            ${missingHeadings.map(h => `- ### ${h}`).join("\n")}

            This usually means the issue template (\`.github/ISSUE_TEMPLATE/repository_creation_request.yml\`) had a field's label/heading changed or removed without this workflow's parsing script (\`.github/workflows/handle-repository-creation-request.yml\`) being updated to match.

            👉 Requester: no action needed on your part - please notify the platform team.
            👉 Platform team: reconcile the field labels in the issue template with the \`extract(...)\` calls in the workflow.
            `;
              core.setOutput("status", "TEMPLATE_MISMATCH");
              core.setOutput("error", msg);
              core.setOutput("warning", JSON.stringify([]));
              core.setOutput("info", JSON.stringify([]));
              return;
            }

            // Dropdown option lists are parsed directly out of the issue template file itself
            // (.github/ISSUE_TEMPLATE/repository_creation_request.yml) rather than kept in a second
            // copy - the template's `options:` lists are the only place those values are ever
            // written, so there is nothing left to keep in sync by hand. It's read from the
            // checked-out working copy (see the "Checkout Repository" step above) rather than a
            // GitHub API call.
            const fs = require("fs");
            const TEMPLATE_PATH = ".github/ISSUE_TEMPLATE/repository_creation_request.yml";

            function reportConfigError(path, detail) {
              const msg = `🛠️ Configuration Load Failed (this is not a requester error)

            This workflow could not load its configuration from \`${path}\`.

            ${detail}

            👉 Requester: no action needed on your part - please notify the platform team.
            👉 Platform team: confirm \`${path}\` exists in this repository and is valid.
            `;
              core.setOutput("status", "CONFIG_ERROR");
              core.setOutput("error", msg);
              core.setOutput("warning", JSON.stringify([]));
              core.setOutput("info", JSON.stringify([]));
            }

            // Org-level variables copied down into every newly created/forked repository. This has
            // no natural home in the issue template (it isn't a field a requester fills in) and isn't
            // worth a whole extra file for a five-item allow-list, so it's just a plain constant -
            // this list is the one and only place to edit it (add/remove a line to change it).
            const COPIABLE_ORG_VARIABLES = [
              "GH_APP_CLIENT_ID",
              "GH_APP_ID",
              "GITLAB_HOST",
              "GITLAB_MY_ORG_SUBGROUP",
              "GITLAB_TOP_LEVEL_GROUP_ID"
            ];
            core.setOutput("copiable_org_variables", JSON.stringify(COPIABLE_ORG_VARIABLES));

            // Hand-rolled line scanner (not a full YAML parser, so no extra npm-install dependency)
            // that pulls the flat list of `- option` strings out of a `type: dropdown` field's
            // `options:` block, given that field's `id:`. It only needs to understand the small
            // subset of YAML shape this template actually uses:
            //   - blank lines separate option "groups" within a single options: list (cosmetic only)
            //   - a trailing `# comment` on an option line is stripped
            //   - a bare `---` divider or `--- Category ---` marker line is a non-selectable heading,
            //     not a real option, and is skipped
            //   - the options: block ends at the next `- type:` (next field), a dedent (e.g.
            //     `default:`/`validations:` closing this field's attributes), or any line that isn't
            //     a `- value` list item
            function extractDropdownOptions(lines, fieldId) {
              const idLineIdx = lines.findIndex(l => new RegExp(`^\\s*id:\\s*${fieldId}\\s*$`).test(l));
              if (idLineIdx === -1) return null;

              let optionsLineIdx = -1;
              for (let i = idLineIdx + 1; i < lines.length; i++) {
                if (/^\s*-\s*type:/.test(lines[i])) break;
                if (/^\s*options:\s*$/.test(lines[i])) { optionsLineIdx = i; break; }
              }
              if (optionsLineIdx === -1) return null;

              const optionsIndent = lines[optionsLineIdx].match(/^(\s*)/)[1].length;
              const values = [];

              for (let i = optionsLineIdx + 1; i < lines.length; i++) {
                const line = lines[i];
                if (/^\s*$/.test(line)) continue; // blank line = cosmetic group separator

                const indent = line.match(/^(\s*)/)[1].length;
                if (indent <= optionsIndent) break; // dedent = end of this options: block

                const dashMatch = line.match(/^\s*-\s*(.+?)\s*$/);
                if (!dashMatch) break; // not a list item = end of this options: block

                const value = dashMatch[1].replace(/\s+#.*$/, "").trim();
                if (value && !value.startsWith("---") && !/^-+$/.test(value)) {
                  values.push(value);
                }
              }
              return values;
            }

            let templateLines;
            try {
              templateLines = fs.readFileSync(TEMPLATE_PATH, "utf8").split("\n");
            } catch (e) {
              reportConfigError(TEMPLATE_PATH, `Error: ${e.message}`);
              return;
            }

            const DROPDOWN_FIELD_IDS = [
              "initiative",
              "product_line",
              "aspect",
              "project_type",
              "tenant_name",
              "visibility"
            ];
            const DROPDOWN_OPTIONS = {};
            const unparsableDropdownFields = [];

            for (const fieldId of DROPDOWN_FIELD_IDS) {
              const values = extractDropdownOptions(templateLines, fieldId);
              if (!values || values.length === 0) {
                unparsableDropdownFields.push(fieldId);
              }
              DROPDOWN_OPTIONS[fieldId] = values || [];
            }

            if (unparsableDropdownFields.length > 0) {
              reportConfigError(
                TEMPLATE_PATH,
                `Could not parse the dropdown option list for field id(s): ${unparsableDropdownFields.map(f => `\`${f}\``).join(", ")}. This usually means a field's \`id:\` or \`options:\` structure was changed in a way the workflow's \`extractDropdownOptions(...)\` parser doesn't recognize - reconcile the two.`
              );
              return;
            }

            let errors = [];
            let warnings = [];

            // Flags a value that isn't blank but doesn't exactly match one of the option list's
            // entries (a blank/missing value is reported separately by the "Missing: <field>"
            // checks below, so this intentionally no-ops on falsy values).
            function validateDropdownValue(fieldLabel, value, validOptions) {
              if (!value) return;
              if (!validOptions.includes(value)) {
                errors.push(
            `❌ Invalid ${fieldLabel} selected.

            Got: "${value}"

            👉 Valid options:
            ${validOptions.map(o => `- \`${o}\``).join("\n")}`
                );
              }
            }

            const product        = extract("Product Line");
            const aspect         = extract("Aspect / Domain");
            const name           = extract("Repository Name");
            const projectType    = extract("Project Type");
            const descriptionRaw = extract("Repository Description \\(Max\\. 350 characters\\)");
            const visibilityRaw  = extract("Repository Visibility");
            let forkSourceUrlRaw = extract("Source Repository URL \\(Optional - for forking\\)");
            // const repoOptions = extract("Repository Options \\(Optional\\)"); // removed with README-init logic
            let initiativeRaw    = extract("Initiative \\(Optional\\)");

            if (projectType && projectType.startsWith("---")) {
              errors.push("❌ Invalid Project Type selected - that's a category marker, not a real option. Please choose an actual project type.");
            }

            // Same "None"/"_No response_" normalization as Tenant Name below - see that comment for
            // why both must be read as "not answered" rather than validated as a selected value.
            // Extracted (and this flag resolved) before Tenant Name below, specifically so the
            // decision of whether to even bother extracting Tenant Name can depend on it.
            const initiativeAnswered = initiativeRaw && initiativeRaw !== "_No response_" && initiativeRaw !== "None";

            if (!initiativeRaw || initiativeRaw === "_No response_" || initiativeRaw === "None") {
              initiativeRaw = "None";
            }

            const initiative = initiativeRaw === "None" ? null : initiativeRaw;

            // A valid Initiative selection takes full precedence over Tenant Name - it's not just
            // that Initiative "wins" in the final repo name, Tenant Name is completely ignored: not
            // extracted from the issue body at all (there's nothing to do with the value even if we
            // had it), not validated against its own option list below, not included in the final
            // repo name, not set as REPO_METADATA_TENANT, and not added as a tenant-* topic (see
            // further down). Skipping the extract() call entirely - rather than extracting it and
            // then discarding the result - is safe specifically because template-drift detection for
            // the "Tenant Name (Optional)" heading does NOT depend on this extract() call: it's
            // already verified unconditionally, for every submission regardless of Initiative, by the
            // TEMPLATE_FIELD_LABELS/headingExists() check above - so drift on that field is still
            // caught even when its value is never looked at here.
            let tenantRaw = initiativeAnswered ? null : extract("Tenant Name \\(Optional\\)");

            // Neither "_No response_" (GitHub's placeholder for an unanswered text/textarea field)
            // nor "None" is a real tenant selection, so both are treated as "no tenant" rather than
            // run through the option-list check below (which would otherwise reject them as invalid
            // whenever the template's own option list doesn't happen to spell out "None" itself).
            // This matters even with an explicit "None" option in the template: GitHub renders the
            // literal text "None" for this field whenever it's left untouched and optional, whether
            // or not "None" is one of the field's own listed options - so it must always be read as
            // "no tenant", never validated as a selected value. A `null` tenantRaw (Initiative
            // answered, so extraction was skipped above) falls into this same "no tenant" bucket.
            const tenantAnswered = tenantRaw && tenantRaw !== "_No response_" && tenantRaw !== "None";

            if (!tenantRaw || tenantRaw === "_No response_" || tenantRaw === "None") {
              tenantRaw = "None";
            }

            let tenant = tenantRaw === "None" ? null : tenantRaw;

            if (!forkSourceUrlRaw || forkSourceUrlRaw === "_No response_") {
              forkSourceUrlRaw = null;
            }

            if (!product) errors.push("❌ Missing: Product Line");
            if (!aspect) errors.push("❌ Missing: Aspect / Domain");
            if (!name) errors.push("❌ Missing: Repository Name");
            if (!projectType) errors.push("❌ Missing: Project Type");
            if (!descriptionRaw) errors.push("❌ Missing: Repository Description");

            // Every dropdown-driven field's value must exactly match one of the options the issue
            // template actually offers (see TEMPLATE_PATH above) - this catches a tampered/edited
            // issue body, not anything a requester can trigger through the dropdown UI itself.
            validateDropdownValue("Product Line", product, DROPDOWN_OPTIONS.product_line || []);
            validateDropdownValue("Aspect / Domain", aspect, DROPDOWN_OPTIONS.aspect || []);
            if (projectType && !projectType.startsWith("---")) {
              validateDropdownValue("Project Type", projectType, DROPDOWN_OPTIONS.project_type || []);
            }
            validateDropdownValue("Repository Visibility", visibilityRaw, DROPDOWN_OPTIONS.visibility || []);
            if (initiativeAnswered) {
              validateDropdownValue("Initiative", initiativeRaw, DROPDOWN_OPTIONS.initiative || []);
            }
            // Tenant Name is skipped entirely (not even validated) once Initiative has a valid
            // answer - it's fully ignored in that case, per the note above where `tenant` is forced
            // to null, so there's nothing to gain from also flagging it as invalid here.
            if (tenantAnswered && !initiativeAnswered) {
              validateDropdownValue("Tenant Name", tenantRaw, DROPDOWN_OPTIONS.tenant_name || []);
            }

            if (name && !/^[a-z0-9-]+$/.test(name)) {
              errors.push("❌ Repository name must be kebab-case (lowercase, numbers, hyphens only).");
            }

            // Description is free text (it's meant to be a readable sentence, not an identifier), so
            // it isn't restricted to kebab-case - but it's still blocked from carrying characters that
            // have historically been abused for injection (backticks/$/angle-brackets/backslashes/
            // control characters), as defense in depth for anywhere this value ends up rendered or
            // processed downstream.
            const DANGEROUS_DESCRIPTION_CHARS = /[`$<>\\\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/;
            if (descriptionRaw && DANGEROUS_DESCRIPTION_CHARS.test(descriptionRaw)) {
              errors.push("❌ Repository Description contains characters that are not allowed (backticks, $, <, >, backslashes, or control characters). Please remove them and try again.");
            }

            const VISIBILITY_CODE_MAP = {
              "Private": "private",
              "Public": "public",
              "Internal (Enterprise only)": "internal"
            };
            const visibility = VISIBILITY_CODE_MAP[visibilityRaw];

            // README-initialization support was removed when this fork feature was added - see the
            // commented-out "Repository Options (Optional)" field in the issue template.
            // let autoInit = false;
            // if (repoOptions) {
            //   autoInit = isChecked(repoOptions, "Initialize repository with README");
            // }

            // Accepts either the HTTPS form (https://github.com/<owner>/<repo>, optionally with a
            // trailing "/" and/or ".git") or the SSH form (git@github.com:<owner>/<repo>.git). This
            // only validates *shape* - whether the repo actually exists and is reachable with our
            // GitHub App credentials is confirmed later by the "Verify Fork Source Repository" step,
            // since that requires a live API call, not just string parsing.
            let forkOwner = null;
            let forkRepo = null;

            if (forkSourceUrlRaw) {
              const httpsMatch = forkSourceUrlRaw.match(/^https:\/\/github\.com\/([A-Za-z0-9-]+)\/([A-Za-z0-9_.-]+?)(?:\.git)?\/?$/);
              const sshMatch    = forkSourceUrlRaw.match(/^git@github\.com:([A-Za-z0-9-]+)\/([A-Za-z0-9_.-]+?)(?:\.git)?$/);
              const m = httpsMatch || sshMatch;

              if (!m) {
                errors.push(
            `❌ Invalid source repository URL.
            Provided value "${forkSourceUrlRaw}" is invalid.

            👉 Expected format:
            \`https://github.com/<owner>/<repo>\`
            or
            \`git@github.com:<owner>/<repo>.git\``
                );
              } else {
                forkOwner = m[1];
                forkRepo = m[2];
              }
            }

            let finalName = null;

            if (product && aspect && name) {
              finalName = tenant
                ? `${product}-${aspect}-${name}-${tenant}`
                : `${product}-${aspect}-${name}`;

              if (finalName.length > 100) {
                errors.push(
            `❌ Repository name exceeds allowed length.

            Allowed max length: 100 characters  
            Computed final repository name:
            ${finalName}

            Computed length: ${finalName.length}

            👉 Naming format:
            \`<product>-<aspect>-<name>[-<tenant>]\``
                );
              }
            }

            function sanitize(v) {
              return v.toLowerCase().replace(/[^a-z0-9-]/g, "-");
            }

            let topics = [];

            if (product && aspect && name && projectType) {
              topics = [
                "managed-by-platform",
                `product-${sanitize(product)}`,
                `aspect-${sanitize(aspect)}`,
                `type-${sanitize(projectType)}`
              ];

              // Initiative and Tenant Name are mutually exclusive as topics too, mirroring the
              // metadata variable below - `tenant` is already forced to null above whenever
              // Initiative was answered, so this "if (tenant)" naturally never fires in that case.
              if (initiative) topics.push(`initiative-${sanitize(initiative)}`);
              if (tenant) topics.push(`tenant-${sanitize(tenant)}`);

              const longTopics = topics.filter(t => t.length > 50);

              if (longTopics.length > 0) {
                errors.push(
            `❌ Some repository topics exceed 50 characters:

            ${longTopics.join("\n")}

            👉 Please shorten input values.`
                );
              }
            }

            if (descriptionRaw && descriptionRaw.length > 350) {
              warnings.push("⚠️ Description exceeds 350 characters and will be truncated.");
            }

            const metadata = {
              REPO_METADATA_PRODUCT_LINE: product,
              REPO_METADATA_ASPECT: aspect,
              REPO_METADATA_NAME: name,
              REPO_METADATA_TYPE: projectType,
              // Mutually exclusive - `tenant` is already forced to null above whenever Initiative
              // was answered, and the "Set Repository Metadata Variables" step skips any metadata
              // value that comes out null/undefined here, so at most one of these two ever actually
              // gets created as a repo variable.
              REPO_METADATA_TENANT: tenant,
              REPO_METADATA_INITIATIVE: initiative,
              REPO_METADATA_MANAGED: true
            };

            if (errors.length > 0) {
              errors.push("ℹ️ To create a new repo please edit this issue and add correct inputs and try again\nOr\nclose this and open a new issue with correct inputs.")
              core.setOutput("status", "PARSE_ERROR");
              core.setOutput("error", errors.join("\n\n"));
              core.setOutput("warning", JSON.stringify(warnings));
              core.setOutput("info", JSON.stringify([]));
              return;
            }

            core.setOutput("status", "OK");
            core.setOutput("success", "✅ Validation successful.");
            core.setOutput("warning", JSON.stringify(warnings));
            core.setOutput("info", JSON.stringify([]));

            core.setOutput("final_name", finalName);
            core.setOutput("visibility", visibility);
            // core.setOutput("auto_init", autoInit); // removed with README-init logic
            core.setOutput("topics", JSON.stringify(topics));
            core.setOutput("metadata", JSON.stringify(metadata));
            if (forkOwner) {
              core.setOutput("fork_source_owner", forkOwner);
              core.setOutput("fork_source_repo", forkRepo);
            }
            core.setOutput("description", descriptionRaw.substring(0, 350));

      - name: Check Repository Existence
        id: check_repository_existence
        if: steps.validate_request.outputs.status == 'OK'
        uses: actions/github-script@v9
        env:
          FINAL_NAME: ${{ steps.validate_request.outputs.final_name }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            try {
              const repo = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: process.env.FINAL_NAME
              });

              const msg = `❌ Repository already exists.
            You can visit the existing repo for more clarity.
            🔗 ${repo.data.html_url}
            ℹ️ To create a new repo please reopen and edit this issue and try again or create a new issue with appropriate inputs.
            `;
              core.setOutput("status", "DUPLICATE_ERROR");
              core.setOutput("error", msg);
            } catch (e) {
              if (e.status === 404) {
                core.setOutput("status", "OK");
                core.setOutput("success", "✅ No duplicate repository.")
              } else {
                const msg = `❌ Failed to verify if repository already exists.

            Repository: ${process.env.FINAL_NAME}

            Error: ${e.message}

            👉 Please edit this issue and retry or close this and create a new issue or contact platform team if issue persists.
            `;
                core.setOutput("status", "ERROR");
                core.setOutput("error", msg);
              }
            }

      # Fails fast with a clear message when the requested fork source repository doesn't exist,
      # is malformed (already caught earlier in Validate Issue Input, but re-verified here for
      # defense in depth), or isn't accessible with our GitHub App's credentials - instead of
      # letting repos.createFork reject the request later with a generic, confusing API error.
      - name: Verify Fork Source Repository
        id: verify_fork_source
        if: steps.check_repository_existence.outputs.status == 'OK' && steps.validate_request.outputs.fork_source_owner != ''
        uses: actions/github-script@v9
        env:
          FORK_SOURCE_OWNER: ${{ steps.validate_request.outputs.fork_source_owner }}
          FORK_SOURCE_REPO: ${{ steps.validate_request.outputs.fork_source_repo }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            try {
              const repo = await github.rest.repos.get({
                owner: process.env.FORK_SOURCE_OWNER,
                repo: process.env.FORK_SOURCE_REPO
              });

              // Captured here (rather than re-fetched later) because this is the one place the
              // source repo is already looked up for every fork request. Forwarded on to the
              // align_forked_repository_settings job below, which needs it to decide whether the
              // requester's desired visibility is actually reachable - GitHub never allows a fork
              // to end up MORE open than its source (a fork of a private repo stays private
              // forever, a fork of an internal repo stays internal-or-private forever, and this
              // can't be changed after the fact by us or anyone else) - so that job clamps to this
              // value instead of requesting something GitHub will reject.
              const sourceVisibility = repo.data.visibility || (repo.data.private ? "private" : "public");

              core.setOutput("status", "OK");
              core.setOutput("success", `✅ Source repository for fork verified: ${repo.data.html_url}`);
              core.setOutput("source_visibility", sourceVisibility);
            } catch (e) {
              let msg;

              if (e.status === 404) {
                msg = `❌ The source repository for forking was not found (or is not accessible to our GitHub App).

            Source: ${process.env.FORK_SOURCE_OWNER}/${process.env.FORK_SOURCE_REPO}

            👉 Please edit this issue and confirm the "Source Repository URL" is correct and that the repository is public, or accessible to the platform's GitHub App, and try again.
            `;
                core.setOutput("status", "FORK_SOURCE_NOT_FOUND");
              } else {
                msg = `❌ Failed to verify the source repository for forking.

            Source: ${process.env.FORK_SOURCE_OWNER}/${process.env.FORK_SOURCE_REPO}

            Error: ${e.message}

            👉 Please edit this issue and retry or contact the platform team if the issue persists.
            `;
                core.setOutput("status", "ERROR");
              }

              core.setOutput("error", msg);
            }

      # Fails fast with a clear message when "Internal" visibility is requested but the org isn't
      # actually on a GitHub Enterprise plan, instead of letting repos.createInOrg reject the
      # request later with a generic, confusing API error.
      #? Requires the GitHub App to have "Organization administration" (read) permission - the
      #? `plan` field on the org is only populated for callers with sufficient org-admin access.
      #? If it comes back undefined, this step treats it as "not enterprise" (fails closed).
      - name: Verify Enterprise Plan for Internal Visibility
        id: verify_enterprise_plan
        if: steps.check_repository_existence.outputs.status == 'OK' && steps.validate_request.outputs.visibility == 'internal'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            try {
              const { data: org } = await github.rest.orgs.get({ org: context.repo.owner });
              const planName = org.plan?.name;

              if (planName !== "enterprise") {
                const msg = `❌ "Internal" repository visibility was requested, but this organization is not on a GitHub Enterprise plan (current plan: ${planName || "unknown"}).

            Internal visibility is only available to organizations owned by a GitHub Enterprise account.

            👉 Please edit this issue and choose "Private" or "Public" visibility instead, or contact the platform team if this organization should be on an Enterprise plan.
            `;
                core.setOutput("status", "ENTERPRISE_REQUIRED");
                core.setOutput("error", msg);
                return;
              }

              core.setOutput("status", "OK");
              core.setOutput("success", "✅ Organization plan supports Internal visibility.");
            } catch (e) {
              const msg = `❌ Failed to verify organization plan for Internal visibility.

            Error: ${e.message}

            👉 Please edit this issue and retry or contact the platform team if the issue persists.
            `;
              core.setOutput("status", "ERROR");
              core.setOutput("error", msg);
            }

      - name: Create Repository
        id: create_repository
        if: >
          steps.check_repository_existence.outputs.status == 'OK' &&
          (steps.validate_request.outputs.visibility != 'internal' || steps.verify_enterprise_plan.outputs.status == 'OK') &&
          (steps.validate_request.outputs.fork_source_owner == '' || steps.verify_fork_source.outputs.status == 'OK')
        uses: actions/github-script@v9
        env:
          FINAL_NAME: ${{ steps.validate_request.outputs.final_name }}
          DESCRIPTION: ${{ steps.validate_request.outputs.description }}
          VISIBILITY: ${{ steps.validate_request.outputs.visibility }}
          FORK_SOURCE_OWNER: ${{ steps.validate_request.outputs.fork_source_owner }}
          FORK_SOURCE_REPO: ${{ steps.validate_request.outputs.fork_source_repo }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            try {
              const isFork = !!process.env.FORK_SOURCE_OWNER;

              if (isFork) {
                // If the fork source is another repo in this same org, GitHub won't let us fork it
                // while its own "Allow forking" setting is off. Rather than failing, temporarily
                // enable forking on the source just long enough to fork it, then restore it back to
                // disabled - regardless of whether the fork call itself succeeds (finally).
                //
                // GitHub org/user logins are case-insensitive (merely case-preserving) - "Zimble-GH"
                // and "zimble-gh" are the same org - so this comparison must not be case-sensitive.
                // A strict === here would wrongly treat a same-org source pasted with different
                // casing as a foreign repo and skip the temporary-enable entirely, causing the fork
                // to fail outright if the source has forking disabled.
                const isSameOrgSource = process.env.FORK_SOURCE_OWNER.toLowerCase() === context.repo.owner.toLowerCase();
                let sourceForkingWasEnabledByUs = false;
                let orgForkingWasEnabledByUs = false;

                if (isSameOrgSource) {
                  try {
                    const { data: sourceRepo } = await github.rest.repos.get({
                      owner: process.env.FORK_SOURCE_OWNER,
                      repo: process.env.FORK_SOURCE_REPO
                    });

                    // GitHub also blocks forking at the organization level - separately from the
                    // repository's own "Allow forking" setting above - via the org's "Allow forking
                    // of private repositories" member privilege. That org policy only ever applies to
                    // non-public (private/internal) source repos - forking a public repo is never
                    // subject to it - so it's only checked/toggled here for those two visibilities.
                    // (GitHub's org settings surface a single "private repositories" control for
                    // this, which - per GitHub's own org settings UI - also governs internal repos;
                    // if this org's plan ever exposes a distinct internal-repos control the REST API
                    // doesn't cover, this toggle will no-op for it and createFork below will still
                    // fail with its own clear error, same as any other untoggleable case.)
                    const sourceVisibility = sourceRepo.visibility || (sourceRepo.private ? "private" : "public");

                    if (sourceVisibility === "private" || sourceVisibility === "internal") {
                      try {
                        const { data: org } = await github.rest.orgs.get({ org: context.repo.owner });

                        if (org.members_can_fork_private_repositories === false) {
                          await github.rest.orgs.update({
                            org: context.repo.owner,
                            members_can_fork_private_repositories: true
                          });
                          orgForkingWasEnabledByUs = true;
                        }
                      } catch (e) {
                        // Best-effort, same reasoning as the repo-level toggle below - e.g. the
                        // GitHub App may lack "Organization administration" (write) permission. Let
                        // createFork fail naturally with its own error if this genuinely can't be
                        // toggled.
                      }
                    }

                    if (sourceRepo.allow_forking === false) {
                      await github.rest.repos.update({
                        owner: process.env.FORK_SOURCE_OWNER,
                        repo: process.env.FORK_SOURCE_REPO,
                        allow_forking: true
                      });
                      sourceForkingWasEnabledByUs = true;
                    }
                  } catch (e) {
                    // Don't block the overall attempt on this check/toggle failing - if forking
                    // genuinely isn't possible, the createFork call below will fail with its own
                    // clear error anyway.
                  }
                }

                let restoreNote = "";
                let orgForkingNeedsRetryDisable = false;

                let forked;
                try {
                  forked = await github.rest.repos.createFork({
                    owner: process.env.FORK_SOURCE_OWNER,
                    repo: process.env.FORK_SOURCE_REPO,
                    organization: context.repo.owner,
                    name: process.env.FINAL_NAME
                  });
                } finally {
                  // Both toggles are restored here, right away, regardless of whether the fork call
                  // itself succeeded.
                  if (sourceForkingWasEnabledByUs) {
                    try {
                      await github.rest.repos.update({
                        owner: process.env.FORK_SOURCE_OWNER,
                        repo: process.env.FORK_SOURCE_REPO,
                        allow_forking: false
                      });
                    } catch (e) {
                      restoreNote += `\n\n⚠️ Forking was temporarily enabled on source repository \`${process.env.FORK_SOURCE_OWNER}/${process.env.FORK_SOURCE_REPO}\` to allow this fork, but re-disabling it afterward failed: ${e.message}. Please disable forking on that repository manually, and contact the platform team if you're not able to.`;
                    }
                  }

                  // Disabling this org-wide policy right away (rather than deferring it) is safe:
                  // the align_forked_repository_settings job below no longer touches the new fork's
                  // own `allow_forking` field for this exact reason - once this org policy is back
                  // off, forking is already blocked org-wide for every private/internal repo
                  // (including this new one), and if the new repo ends up public, GitHub doesn't
                  // support disabling forking on a forked repo regardless of this org setting - so
                  // there's nothing left for that job to need this policy still enabled for.
                  //
                  // If this restore attempt fails, we don't want to just warn and move on - it's
                  // retried once more, automatically, by the align_forked_repository_settings job
                  // after it finishes aligning the fork's other settings (see
                  // ORG_FORKING_NEEDS_RETRY_DISABLE there), as a backstop in case this first attempt
                  // hit a transient error.
                  if (orgForkingWasEnabledByUs) {
                    try {
                      await github.rest.orgs.update({
                        org: context.repo.owner,
                        members_can_fork_private_repositories: false
                      });
                    } catch (e) {
                      orgForkingNeedsRetryDisable = true;
                    }
                  }
                }

                // Handed to the align_forked_repository_settings job below (via this step's/job's
                // outputs) so it retries disabling this org policy if the attempt above just failed -
                // it's a no-op there when this is "false" (either never enabled, or already
                // successfully disabled above).
                core.setOutput("org_forking_needs_retry_disable", orgForkingNeedsRetryDisable ? "true" : "false");

                // repos.createFork doesn't accept description/visibility/merge-strategy options up
                // front - and GitHub forks a repo's content in the background, so calling
                // repos.update right away frequently fails with "A previous repository operation is
                // still in progress." Rather than attempting that alignment here (and either
                // blocking this step with retries, or reporting a false-alarm warning on the first
                // failed attempt), it's handled by the separate, later "align_forked_repository_settings"
                // job, which polls with backoff and reports its own result as a follow-up issue
                // comment once the fork has settled.
                core.setOutput("status", "OK");
                core.setOutput(
                  "success",
                  `✅ Repository forked successfully from ${process.env.FORK_SOURCE_OWNER}/${process.env.FORK_SOURCE_REPO}.\n\n🔗 ${forked.data.html_url}\n\nℹ️ Description/visibility/merge settings are being aligned in the background (GitHub forks content asynchronously) - a follow-up comment will confirm once that's done.${restoreNote}`
                );
              } else {
                const repo = await github.rest.repos.createInOrg({
                  org: context.repo.owner,
                  name: process.env.FINAL_NAME,
                  description: process.env.DESCRIPTION,
                  visibility: process.env.VISIBILITY,
                  allow_merge_commit: false,
                  allow_squash_merge: false,
                  allow_update_branch: true,
                  // Repos this workflow creates are never forkable by default, regardless of
                  // visibility - GitHub does support disabling forking on public repos too (not just
                  // private/internal), so this applies uniformly.
                  allow_forking: false
                  // auto_init / README-initialization removed - see the commented-out
                  // "Repository Options (Optional)" field in the issue template.
                });

                core.setOutput("status", "OK");
                core.setOutput("success", `✅ Repository created successfully.\n\n🔗 ${repo.data.html_url}`);
              }

            } catch (e) {
              const msg = `❌ Failed to create repo.

            Repository: ${process.env.FINAL_NAME}

            Error: ${e.message}

            👉 Please edit this issue and retry or close this and create a new issue or contact platform team if issue persists.
            `;
              core.setOutput("status", "ERROR");
              core.setOutput("error", msg);
            }

      - name: Apply Repository Topics
        id: apply_repository_topics
        continue-on-error: true
        if: steps.create_repository.outputs.status == 'OK'
        uses: actions/github-script@v9
        env:
          FINAL_NAME: ${{ steps.validate_request.outputs.final_name }}
          TOPICS: ${{ steps.validate_request.outputs.topics }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            try {
              await github.rest.repos.replaceAllTopics({
                owner: context.repo.owner,
                repo: process.env.FINAL_NAME,
                names: JSON.parse(process.env.TOPICS)
              });

              core.setOutput("status", "OK");
              core.setOutput("success", "✅ Topics applied successfully.");

            } catch (e) {
              const msg = `⚠️ Failed to apply repository topics.

            Repository: ${process.env.FINAL_NAME}

            Topics:
            ${process.env.TOPICS}

            Error:
            ${e.message}
            `;
              core.setOutput("status", "ERROR");
              core.setOutput("error", msg);
            }

      - name: Set Repository Metadata Variables
        id: set_repository_metadata
        continue-on-error: true
        if: steps.create_repository.outputs.status == 'OK'
        uses: actions/github-script@v9
        env:
          FINAL_NAME: ${{ steps.validate_request.outputs.final_name }}
          METADATA: ${{ steps.validate_request.outputs.metadata }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            const metadata = JSON.parse(process.env.METADATA);
            let failures = [];
            let successCount = 0;

            for (const [key, value] of Object.entries(metadata)) {
              if (value === null || value === undefined) continue;

              try {
                await github.rest.actions.createRepoVariable({
                  owner: context.repo.owner,
                  repo: process.env.FINAL_NAME,
                  name: key,
                  value: String(value)
                });
                successCount++;
              } catch (e) {
                failures.push(`Variable: ${key}\nError: ${e.message}`);
              }
            }

            if (failures.length === 0) {
              core.setOutput("status", "OK");
              core.setOutput("success", "✅ Metadata variables applied successfully.");
            } else {
              const msg = `⚠️ Some repository metadata variables failed to be created.

            Repository: ${process.env.FINAL_NAME}

            Successful: ${successCount}
            Failed: ${failures.length}

            Failure details:
            ${failures.join("\n\n")}
            `;
              core.setOutput("status", "ERROR");
              core.setOutput("error", msg);
            }

      - name: Copy Organization Variables to Repository
        id: copy_organization_variables
        continue-on-error: true
        if: steps.create_repository.outputs.status == 'OK'
        uses: actions/github-script@v9
        env:
          FINAL_NAME: ${{ steps.validate_request.outputs.final_name }}
          COPIABLE_VARS: ${{ steps.validate_request.outputs.copiable_org_variables }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            // Only these org-level variables are ever copied down to a newly created/forked repo -
            // the allow-list is a constant defined once in "Validate Issue Input" and passed forward
            // here (see COPIABLE_ORG_VARIABLES there), not re-declared in this script. Every other
            // org variable is ignored entirely, regardless of its visibility setting.
            const allowList = JSON.parse(process.env.COPIABLE_VARS || "[]");

            let failures = [];
            let skipped = [];
            let successCount = 0;

            let allVars;

            try {
              allVars = await github.paginate(
                github.rest.actions.listOrgVariables,
                { org: context.repo.owner }
              );
            } catch (e) {
              const msg = `⚠️ Failed to fetch organization variables.

            Error: ${e.message}
            `;
              core.setOutput("status", "ERROR");
              core.setOutput("error", msg);
              return;
            }

            const varsByName = new Map((allVars || []).map(v => [v.name, v]));

            for (const name of allowList) {
              const v = varsByName.get(name);

              if (!v) continue; // reported separately below, as "missing"

              if (v.visibility === "selected") {
                skipped.push(name);
                continue;
              }

              try {
                await github.rest.actions.createRepoVariable({
                  owner: context.repo.owner,
                  repo: process.env.FINAL_NAME,
                  name: v.name,
                  value: v.value
                });
                successCount++;
              } catch (e) {
                failures.push(`Variable: ${name}\nError: ${e.message}`);
              }
            }

            const missing = allowList.filter(name => !varsByName.has(name));

            let infoMsg = "";
            if (skipped.length > 0) {
              infoMsg = `ℹ️ Skipped organization variables with restricted visibility ("selected"):

            ${skipped.join("\n")}
            `;
            }
            core.setOutput("info", infoMsg);

            let warningMsg = "";
            if (missing.length > 0) {
              warningMsg = `⚠️ The following organization variable(s) are configured to be copied into new repositories, but were not found at the organization level:

            ${missing.map(n => `- ${n}`).join("\n")}

            👉 Please ask the platform team to define ${missing.length > 1 ? "these organization variables" : "this organization variable"}.
            `;
            }
            core.setOutput("warning", warningMsg);

            if (failures.length === 0) {
              core.setOutput("status", "OK");
              core.setOutput("success", "✅ Organization variables copied successfully.");
            } else {
              const msg = `⚠️ Some organization variables failed to copy.

            Repository: ${process.env.FINAL_NAME}

            Allow-listed: ${allowList.length}
            Successfully Copied: ${successCount}
            Skipped (restricted): ${skipped.length}
            Missing at org level: ${missing.length}
            Failed: ${failures.length}

            Failure details:
            ${failures.join("\n\n")}
            `;
              core.setOutput("status", "ERROR");
              core.setOutput("error", msg);
            }

