      - name: Sync Secrets to Repository
        id: sync_repository_secrets
        continue-on-error: true
        if: steps.create_repository.outputs.status == 'OK'
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ steps.generate_github_app_token.outputs.token }}
          REPO: ${{ steps.validate_request.outputs.final_name }}
          ORG: ${{ github.repository_owner }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN || vars.GITLAB_API_TOKEN }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || vars.GH_APP_PRIVATE_KEY }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            try {
              const { execSync } = require("child_process");

              const repo = `${process.env.ORG}/${process.env.REPO}`;

              execSync(`echo "${process.env.GITLAB_API_TOKEN}" | gh secret set GITLAB_API_TOKEN --repo ${repo}`);
              execSync(`echo "${process.env.GH_APP_PRIVATE_KEY}" | gh secret set GH_APP_PRIVATE_KEY --repo ${repo}`);

              core.setOutput("status", "OK");
              core.setOutput("success", "✅ Secrets synced successfully.");

            } catch (e) {
              core.setOutput("status", "ERROR");
              core.setOutput("error", `⚠️ Failed to sync secrets.\n\nError: ${e.message}`);
            }

  # Runs independently of update_issue_status below (both just `needs: provision_repository`, so
  # they run in parallel rather than one blocking the other) - this job polls, with backoff, for the
  # forked repo's description/visibility/merge/Issues settings to be alignable, since GitHub forks a repo's
  # content asynchronously and repos.update calls made too soon fail with "A previous repository
  # operation is still in progress." It reports its own result as a follow-up issue comment once
  # resolved (success or final failure), rather than making the main "repository created" comment
  # wait on it.
  align_forked_repository_settings:
    name: Align Forked Repository Settings
    needs: provision_repository
    if: >
      needs.provision_repository.result == 'success' &&
      needs.provision_repository.outputs.create_status == 'OK' &&
      needs.provision_repository.outputs.fork_source_owner != ''
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: generate_github_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY || vars.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Wait For Fork To Settle, Then Align Settings
        id: align_settings
        uses: actions/github-script@v9
        env:
          FINAL_NAME: ${{ needs.provision_repository.outputs.final_name }}
          DESCRIPTION: ${{ needs.provision_repository.outputs.description }}
          VISIBILITY: ${{ needs.provision_repository.outputs.visibility }}
          FORK_SOURCE_OWNER: ${{ needs.provision_repository.outputs.fork_source_owner }}
          FORK_SOURCE_REPO: ${{ needs.provision_repository.outputs.fork_source_repo }}
          FORK_SOURCE_VISIBILITY: ${{ needs.provision_repository.outputs.fork_source_visibility }}
          ORG_FORKING_NEEDS_RETRY_DISABLE: ${{ needs.provision_repository.outputs.org_forking_needs_retry_disable }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            function sleep(ms) {
              return new Promise(resolve => setTimeout(resolve, ms));
            }

            // Retry with linear-then-capped backoff: 10s, 20s, 30s, 40s, 50s, then 60s per attempt
            // up to MAX_ATTEMPTS - roughly 7.5 minutes of headroom in total, which comfortably
            // covers typical GitHub fork-content-copy times for small/medium repos. Only the known
            // transient "previous operation in progress" error is retried; anything else fails fast.
            const MAX_ATTEMPTS = 10;
            const BASE_DELAY_MS = 10_000;
            const MAX_DELAY_MS = 60_000;

            // GitHub never allows a fork to end up MORE open than the repository it was forked
            // from (a fork of a private repo stays private forever, a fork of an internal repo
            // stays internal-or-private forever), and this can't be changed after the fact - not
            // by us, not by the requester, not even by hand in the repo's own Settings UI, where
            // the "Change visibility" control is permanently disabled on any fork. Rather than
            // let the repos.update call below fail outright on an unviable request (which would
            // otherwise also block description/Issues/merge-setting alignment, even though only
            // visibility was ever the problem), the requested visibility is clamped here to the
            // most open value GitHub will actually accept for this fork, and the requester is
            // told about the substitution as a warning further down.
            const OPENNESS_RANK = { private: 0, internal: 1, public: 2 };
            const VISIBILITY_LABELS = { private: "Private", internal: "Internal (Enterprise only)", public: "Public" };
            const requestedVisibility = process.env.VISIBILITY;
            const sourceVisibility = process.env.FORK_SOURCE_VISIBILITY;

            const visibilityIsViable =
              !sourceVisibility || OPENNESS_RANK[requestedVisibility] <= OPENNESS_RANK[sourceVisibility];
            const effectiveVisibility = visibilityIsViable ? requestedVisibility : sourceVisibility;

            const visibilityWarning = visibilityIsViable ? "" : `\n\n⚠️ Requested visibility "${VISIBILITY_LABELS[requestedVisibility]}" is not allowed for a fork of \`${process.env.FORK_SOURCE_OWNER}/${process.env.FORK_SOURCE_REPO}\` (visibility: ${VISIBILITY_LABELS[sourceVisibility]}) - GitHub never allows a fork to be more open than the repository it was forked from, and this can't be changed after the fact. Visibility has been kept at "${VISIBILITY_LABELS[sourceVisibility]}" instead.`;

            let lastError = null;
            let lastAttempt = 0;
            let alignedOk = false;

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
              lastAttempt = attempt;
              try {
                await github.rest.repos.update({
                  owner: context.repo.owner,
                  repo: process.env.FINAL_NAME,
                  description: process.env.DESCRIPTION,
                  visibility: effectiveVisibility,
                  allow_merge_commit: false,
                  allow_squash_merge: false,
                  allow_update_branch: true,
                  // GitHub's createFork API always creates forks with Issues disabled,
                  // regardless of the source repository's own Issues setting - there's no
                  // parameter on createFork itself to control this, so it has to be turned back
                  // on here, alongside the other fork-time defaults this job already corrects.
                  // This deliberately does NOT look at the source repo's has_issues value -
                  // forked repos are always given Issues enabled, mirroring how a brand-new
                  // (non-fork) repository behaves in the "Create Repository" step above, where
                  // has_issues is left unset and GitHub's own default for newly created repos
                  // (true) applies.
                  has_issues: true
                  // No allow_forking here, deliberately - unlike a freshly created (non-fork) repo,
                  // a fork's forking-related state is already governed by the "Create Repository"
                  // step: a private/internal fork is already unforkable once the org-level "Allow
                  // forking of private repositories" policy is back off (that blocks forking any
                  // private/internal repo org-wide, this new one included, regardless of its own
                  // allow_forking value - making a separate per-repo toggle redundant), and GitHub
                  // doesn't support disabling forking on a repo that is itself a fork when it's
                  // public. Including allow_forking in this call previously caused GitHub to reject
                  // the whole update with "This organization does not allow private repository
                  // forking" whenever the org policy had already been restored to disabled by the
                  // time this ran - and non-atomically: description had already been persisted before
                  // that later field was rejected, which is why a partial update was observed.
                });

                alignedOk = true;
                break;
              } catch (e) {
                lastError = e;

                const isTransient = /previous repository operation is still in progress/i.test(e.message || "");

                if (!isTransient || attempt === MAX_ATTEMPTS) {
                  break;
                }

                await sleep(Math.min(BASE_DELAY_MS * attempt, MAX_DELAY_MS));
              }
            }

            // Backstop retry: the "Create Repository" step (in the other job) already tried to
            // disable the org's "Allow forking of private repositories" policy right after forking -
            // this only runs, once, if that first attempt failed (e.g. a transient API error), so the
            // org isn't left with that policy stuck enabled just because of one failed call.
            let orgRestoreNote = "";
            if (process.env.ORG_FORKING_NEEDS_RETRY_DISABLE === "true") {
              try {
                await github.rest.orgs.update({
                  org: context.repo.owner,
                  members_can_fork_private_repositories: false
                });
              } catch (e) {
                orgRestoreNote = `\n\n⚠️ The organization's "Allow forking of private repositories" setting was temporarily enabled to allow this fork, and could not be re-disabled (even after a retry): ${e.message}. Please disable it manually in organization settings, and contact the platform team if you're not able to.`;
              }
            }

            if (alignedOk) {
              core.setOutput("status", "OK");
              core.setOutput(
                "success",
                `✅ Forked repository settings (description/visibility/merge options, Issues) aligned successfully for \`${process.env.FINAL_NAME}\` (attempt ${lastAttempt}/${MAX_ATTEMPTS}).${orgRestoreNote}${visibilityWarning}`
              );
            } else {
              const msg = `⚠️ Forked repository \`${process.env.FINAL_NAME}\` was created, but its description/visibility/merge/Issues settings could not be aligned (gave up after ${lastAttempt}/${MAX_ATTEMPTS} attempt(s)).

            Error: ${lastError?.message}

            👉 You may need to update these settings manually, or contact the platform team if this keeps happening.${orgRestoreNote}${visibilityWarning}
            `;
              core.setOutput("status", "ERROR");
              core.setOutput("error", msg);
            }

      - name: Comment Alignment Result on Issue
        uses: actions/github-script@v9
        env:
          STATUS: ${{ steps.align_settings.outputs.status }}
          SUCCESS_MSG: ${{ steps.align_settings.outputs.success }}
          ERROR_MSG: ${{ steps.align_settings.outputs.error }}
        with:
          script: |
            const body = process.env.STATUS === "OK" ? process.env.SUCCESS_MSG : process.env.ERROR_MSG;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  update_issue_status:
    name: Update Issue Status
    needs: provision_repository
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Comment on Issue and Update Status
        uses: actions/github-script@v9
        env:
          DATA: ${{ toJson(needs.provision_repository.outputs) }}
          JOB_RESULT: ${{ needs.provision_repository.result }}
        with:
          script: |
            const jobResult = process.env.JOB_RESULT;

            // provision_repository is a conditional job (see its `if:`). If the issue's title
            // prefix or required label is mutated - or the issue isn't open - after the issue was
            // opened, that job's run condition stops matching and it is SKIPPED rather than failed.
            // This job runs unconditionally (`if: always()`) and normally reports on
            // provision_repository's step outputs, but a skipped job produces none of those outputs
            // - so without this check we'd fall through to an empty comment body, which the GitHub
            // API rejects outright. Detect the skip explicitly and explain why, so it's obvious this
            // isn't the requester's fault and how to retrigger provisioning.
            if (jobResult === "skipped") {
              const issue = context.payload.issue;
              const reasons = [];

              if (issue.state !== "open") {
                reasons.push(`the issue state is "${issue.state}" (must be "open")`);
              }

              const labels = (issue.labels || []).map(l => l.name);
              if (!labels.includes("repo-creation-request")) {
                reasons.push("the `repo-creation-request` label is missing");
              }

              if (!issue.title.startsWith("[REPO-CREATION-REQUEST]")) {
                reasons.push("the issue title no longer starts with `[REPO-CREATION-REQUEST]`");
              }

              const reasonText = reasons.length > 0
                ? reasons.map(r => `- ${r}`).join("\n")
                : "the trigger conditions for automated provisioning were not met (reason could not be determined - please contact the platform team)";

              const body = `⚠️ Automated Provisioning Skipped
            ---------

            Automated repository provisioning did **not** run for this issue because:

            ${reasonText}

            👉 To retry: restore the required title prefix (\`[REPO-CREATION-REQUEST]\`) and the \`repo-creation-request\` label, make sure the issue is open, then edit the issue again to retrigger this workflow. Contact the platform team if you need help.
            `;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });

              return;
            }

            const d = JSON.parse(process.env.DATA || "{}");

            let success = [];
            let warnings = [];
            let info = [];
            let errors = [];

            function safeParse(val) {
              try {
                return JSON.parse(val || "[]");
              } catch {
                return [];
              }
            }

            if (d.validate_status === "PARSE_ERROR"
             || d.validate_status === "TEMPLATE_MISMATCH"
             || d.validate_status === "CONFIG_ERROR") {
              errors.push(d.validate_error);
            } else {
              if (d.validate_success) success.push(d.validate_success);
              warnings.push(...safeParse(d.validate_warning));
            }

            if (d.duplicate_status === "DUPLICATE_ERROR"
             || d.duplicate_status === "ERROR") errors.push(d.duplicate_error);
            else if (d.duplicate_status === "OK") success.push(d.duplicate_success);

            if (d.fork_status === "FORK_SOURCE_NOT_FOUND"
             || d.fork_status === "ERROR") errors.push(d.fork_error);
            else if (d.fork_status === "OK") success.push(d.fork_success);

            if (d.enterprise_status === "ENTERPRISE_REQUIRED"
             || d.enterprise_status === "ERROR") errors.push(d.enterprise_error);
            else if (d.enterprise_status === "OK") success.push(d.enterprise_success);

            if (d.create_status === "ERROR") errors.push(d.create_error);
            else if (d.create_status === "OK") success.push(d.create_success);

            if (d.topics_status === "ERROR") warnings.push(d.topics_error);
            else if (d.topics_status === "OK") success.push(d.topics_success);

            if (d.metadata_status === "ERROR") warnings.push(d.metadata_error);
            else if (d.metadata_status === "OK") success.push(d.metadata_success);

            if (d.org_vars_status === "ERROR") warnings.push(d.org_vars_error);
            else if (d.org_vars_status === "OK") success.push(d.org_vars_success);

            if (d.secrets_status === "ERROR") warnings.push(d.secrets_error)
            else if (d.secrets_status === "OK") success.push(d.secrets_success);

            if (d.org_vars_warning) warnings.push(d.org_vars_warning);
            if (d.org_vars_info) info.push(d.org_vars_info);

            let body = "";

            if (success.length > 0) {
              body += `✅ Success:\n---------\n\n${success.join("\n\n")}`;
            }

            if (errors.length > 0) {
              body += `\n\n❌ Errors:\n---------\n\n${errors.join("\n\n")}`;
            }

            if (warnings.length > 0) {
              body += `\n\n⚠️ Warnings:\n---------\n\n${warnings.join("\n\n")}`;
            }

            if (info.length > 0) {
              body += `\n\nℹ️ Info:\n---------\n\n${info.join("\n\n")}`;
            }

            // Safety net: if provision_repository ran but somehow produced no reportable outputs
            // (e.g. it failed before any step set its outputs, such as GitHub App token generation
            // failing), fall back to a non-empty, still-informative comment instead of calling
            // createComment with an empty body (which the API rejects).
            if (!body) {
              body = `⚠️ Automated provisioning did not produce a status report (job result: \`${jobResult}\`).

            Please contact the platform team.
            `;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            if (d.create_status === "OK" || d.duplicate_status === "DUPLICATE_ERROR") {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: "closed"
              });
            }
